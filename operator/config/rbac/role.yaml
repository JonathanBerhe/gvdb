---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gvdb.gvdb.io
  resources:
  - gvdbclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gvdb.gvdb.io
  resources:
  - gvdbclusters/finalizers
  verbs:
  - update
- apiGroups:
  - gvdb.gvdb.io
  resources:
  - gvdbclusters/status
  verbs:
  - get
  - patch
  - update
