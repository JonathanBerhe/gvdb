name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'grafana/**'
      - 'deploy/**'
      - 'ui/**'
      - '*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for C++ changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'include/**'
              - 'proto/**'
              - 'test/**'
              - 'CMakeLists.txt'
              - 'Makefile'

      - name: Install system dependencies
        if: steps.filter.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          # Remove pre-installed libssl-dev — its OpenSSL 3.x headers
          # conflict with the AWS SDK's bundled aws-lc/s2n-tls build.
          sudo apt-get remove -y libssl-dev 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            libasio-dev \
            libomp-dev \
            libopenblas-dev \
            liblapack-dev \
            zlib1g-dev \
            libcurl4-gnutls-dev

      - name: Set up ccache
        if: steps.filter.outputs.cpp == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ccache-gcc-

      - name: Cache FetchContent sources
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/cache@v5
        id: fc-cache
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-

      - name: Build
        if: steps.filter.outputs.cpp == 'true'
        run: >
          make build
          BUILD_TYPE=Release
          CMAKE_EXTRA="-DBUILD_TESTING=ON -DGVDB_WITH_S3=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ steps.fc-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}"

      - name: Test
        if: steps.filter.outputs.cpp == 'true'
        run: make test

      - name: Upload server binary
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gvdb-server
          path: build/bin/gvdb-single-node
          retention-days: 1

      - name: Skip notice
        if: steps.filter.outputs.cpp == 'false'
        run: echo "No C++ changes detected — skipping build and test"

  # ==========================================================================
  # GCS backend build lane
  # ==========================================================================
  # Compiles and links the -DGVDB_WITH_GCS=ON path against a real
  # google-cloud-cpp (storage), which the default build does not exercise.
  # Only google-cloud-cpp comes from vcpkg (the sole find_package consumer);
  # every other dependency still uses the project's FetchContent, so this
  # lane's real job is to surface any abseil diamond (gvdb's FetchContent
  # abseil vs the one vcpkg's google-cloud-cpp pulls) that would only appear
  # at executable link time. Gated to GCS-relevant changes so the heavy
  # vcpkg build does not run on every PR.
  gcs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for GCS-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gcs:
              - 'src/storage/gcs_object_store.cpp'
              - 'include/storage/gcs_object_store.h'
              - 'src/storage/object_store_factory.cpp'
              - 'include/storage/object_store_factory.h'
              - 'src/storage/CMakeLists.txt'
              - 'CMakeLists.txt'
              - 'test/e2e/gcs_storage.go'
              - '.github/workflows/ci.yml'

      - name: Install system dependencies
        if: steps.filter.outputs.gcs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            curl zip unzip tar \
            pkg-config \
            libasio-dev \
            libomp-dev \
            libopenblas-dev \
            liblapack-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Set up ccache
        if: steps.filter.outputs.gcs == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-gcs-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ccache-gcs-
            ccache-gcc-

      - name: Set up vcpkg
        if: steps.filter.outputs.gcs == 'true'
        run: |
          # Pin vcpkg to a known commit for reproducible google-cloud-cpp
          # versions. Bump deliberately, not implicitly.
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout 2024.12.16
          "$HOME/vcpkg"/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary artifacts
        if: steps.filter.outputs.gcs == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-gcs-${{ runner.os }}-2024.12.16
          restore-keys: |
            vcpkg-gcs-${{ runner.os }}-

      - name: Install google-cloud-cpp (storage)
        if: steps.filter.outputs.gcs == 'true'
        run: |
          "$VCPKG_ROOT"/vcpkg install "google-cloud-cpp[core,storage]" \
            --triplet x64-linux

      - name: Cache FetchContent sources
        if: steps.filter.outputs.gcs == 'true'
        uses: actions/cache@v5
        id: fc-cache
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-

      - name: Configure (GVDB_WITH_GCS=ON)
        if: steps.filter.outputs.gcs == 'true'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DGVDB_WITH_GCS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ steps.fc-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

      # Stage 1 — compile-check: builds gvdb_storage (a static lib), which
      # compiles gcs_object_store.cpp against the real google-cloud-cpp
      # headers. Validates the SDK API usage without touching the link-time
      # abseil diamond. This is the primary signal.
      - name: Build gvdb_storage (GCS compile-check)
        if: steps.filter.outputs.gcs == 'true'
        run: cmake --build build --target gvdb_storage -j"$(nproc)"

      # Stage 2 — link-check: links gvdb-single-node, which pulls both
      # google-cloud-cpp (+ its abseil) and gRPC (+ the FetchContent abseil)
      # into one executable. A duplicate-symbol / ODR failure here is the
      # abseil diamond and tells us the find_package integration needs
      # dependency convergence.
      - name: Build gvdb-single-node (GCS link-check)
        if: steps.filter.outputs.gcs == 'true'
        run: cmake --build build --target gvdb-single-node -j"$(nproc)"

      - name: Skip notice
        if: steps.filter.outputs.gcs == 'false'
        run: echo "No GCS-relevant changes — skipping GCS build lane"

  test-python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for Python SDK changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'clients/python/**'
              - 'proto/vectordb.proto'

      - name: Install uv
        if: steps.filter.outputs.python == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download server binary
        if: steps.filter.outputs.python == 'true'
        uses: actions/download-artifact@v8
        with:
          name: gvdb-server
          path: build/bin

      - name: Make server executable
        if: steps.filter.outputs.python == 'true'
        run: chmod +x build/bin/gvdb-single-node

      - name: Install runtime deps
        if: steps.filter.outputs.python == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libomp5 libgomp1 libopenblas0 liblapack3

      - name: Install Python SDK deps
        if: steps.filter.outputs.python == 'true'
        run: cd clients/python && uv sync

      - name: Lint Python SDK
        if: steps.filter.outputs.python == 'true'
        run: make lint-sdk

      - name: Run Python SDK tests
        if: steps.filter.outputs.python == 'true'
        run: make test-sdk

      - name: Skip notice
        if: steps.filter.outputs.python == 'false'
        run: echo "No Python SDK changes — skipping"

  test-java-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for Java connector changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            java:
              - 'connectors/**'
              - 'proto/vectordb.proto'

      - name: Set up JDK 17
        if: steps.filter.outputs.java == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        if: steps.filter.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        if: steps.filter.outputs.java == 'true'
        run: cd connectors && ./gradlew build -x :gvdb-connector-tests:test

      - name: Skip notice
        if: steps.filter.outputs.java == 'false'
        run: echo "No Java connector changes — skipping"

  test-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for operator changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            operator:
              - 'operator/**'
              - 'deploy/helm/gvdb-operator/**'
              - 'proto/vectordb.proto'
            gvdb-chart:
              - 'deploy/helm/gvdb/**'

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: operator/go.sum

      - name: Vet
        if: steps.filter.outputs.operator == 'true'
        run: cd operator && go vet ./...

      - name: Unit tests (render + controller pure logic)
        if: steps.filter.outputs.operator == 'true'
        run: make test-operator

      - name: envtest (reconciler against fake apiserver)
        if: steps.filter.outputs.operator == 'true'
        run: cd operator && make test

      - name: Build operator binary
        if: steps.filter.outputs.operator == 'true'
        run: make build-operator

      - name: Lint Helm chart
        if: steps.filter.outputs.operator == 'true'
        run: helm lint deploy/helm/gvdb-operator

      # Mirror of the gvdb chart guard: a bare `gvdb-operator:tag` would
      # resolve to docker.io/library/gvdb-operator on any fresh cluster
      # and break the published `helm install oci://ghcr.io/...` path
      # with ImagePullBackOff.
      - name: helm template default image has registry (operator)
        if: steps.filter.outputs.operator == 'true'
        run: |
          if helm template gvdb-operator deploy/helm/gvdb-operator | grep -E '^\s+image: "?[^/]+:'; then
            echo "ERROR: rendered operator image lacks a registry prefix"
            exit 1
          fi

      - name: Lint gvdb chart
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: helm lint deploy/helm/gvdb

      # Render with default values to catch templating regressions that
      # would change the dev/kind install behavior. Hardening primitives
      # are gated, so the default render must remain stable.
      - name: helm template smoke (default values)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: helm template gvdb deploy/helm/gvdb > /dev/null

      # Guard against image.repository regressing to a registry-less
      # string. A bare `gvdb:tag` resolves to docker.io/library/gvdb on
      # any fresh cluster and breaks the published `helm install
      # oci://ghcr.io/...` path with ImagePullBackOff.
      - name: helm template default image has registry
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          if helm template gvdb deploy/helm/gvdb | grep -E '^\s+image: "[^/]+:'; then
            echo "ERROR: rendered image lacks a registry prefix"
            exit 1
          fi

      - name: helm template smoke (EKS overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            -f deploy/helm/gvdb/values-eks.yaml)
          # The overlay's whole point is that NLB annotations and gp3
          # storage classes land in the rendered output. If the proxy
          # service template or a workload's storage block stops plumbing
          # these, the overlay becomes a no-op and we want the build to
          # fail loudly.
          echo "$out" | grep -q 'aws-load-balancer-scheme: internal' || \
            { echo "ERROR: proxy NLB annotations missing from EKS overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "gp3"' || \
            { echo "ERROR: gp3 storageClassName missing from EKS overlay render"; exit 1; }

      - name: helm template smoke (GKE overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            -f deploy/helm/gvdb/values-gke.yaml)
          # The overlay must plumb the GKE internal-LB annotation and the PD
          # storage classes into the render; if a template stops threading
          # them the overlay silently no-ops, so fail loudly.
          echo "$out" | grep -q 'networking.gke.io/load-balancer-type: Internal' || \
            { echo "ERROR: internal LB annotation missing from GKE overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "premium-rwo"' || \
            { echo "ERROR: premium-rwo storageClassName missing from GKE overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "standard-rwo"' || \
            { echo "ERROR: standard-rwo storageClassName missing from GKE overlay render"; exit 1; }

      - name: helm template smoke (pre-upgrade hook)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            --set preUpgradeHook.enabled=true)
          # Hook is gated on a single flag; when enabled it must emit the
          # SA + Role + RoleBinding + Job all annotated with helm.sh/hook
          # pre-upgrade. Catches regressions where the gate, RBAC, or
          # hook annotations get dropped silently.
          echo "$out" | grep -qE 'helm\.sh/hook: "?pre-upgrade"?' || \
            { echo "ERROR: pre-upgrade hook annotation missing"; exit 1; }
          echo "$out" | grep -q 'name: gvdb-pre-upgrade$' || \
            { echo "ERROR: pre-upgrade ServiceAccount/Role/RoleBinding missing"; exit 1; }
          echo "$out" | grep -q 'kubectl .* rollout status' || \
            { echo "ERROR: pre-upgrade Job rollout check missing"; exit 1; }

      - name: helm template smoke (pod hardening)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Component label must land on every workload's pods, and the
          # per-workload nodeSelector / tolerations / podAnnotations
          # must thread into the rendered pod spec when set.
          out=$(helm template gvdb deploy/helm/gvdb \
            --set 'coordinator.nodeSelector.role=gvdb' \
            --set 'dataNode.tolerations[0].key=dedicated' \
            --set 'dataNode.tolerations[0].operator=Exists' \
            --set 'proxy.podAnnotations.example\.io/scrape=true')
          for c in coordinator data-node query-node proxy; do
            echo "$out" | grep -q "app.kubernetes.io/component: $c" || \
              { echo "ERROR: component label missing for $c"; exit 1; }
          done
          echo "$out" | grep -q 'role: gvdb' || \
            { echo "ERROR: coordinator.nodeSelector not threaded into pod spec"; exit 1; }
          echo "$out" | grep -q 'key: dedicated' || \
            { echo "ERROR: dataNode.tolerations not threaded into pod spec"; exit 1; }
          echo "$out" | grep -q 'example.io/scrape:' || \
            { echo "ERROR: proxy.podAnnotations not threaded into pod template"; exit 1; }

      - name: helm template smoke (ingress + GRPCRoute)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Ingress kind: legacy nginx-style with gRPC backend-protocol
          # annotation, IngressClass and TLS secret reference.
          ing=$(helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.host=gvdb.example.com \
            --set ingress.className=nginx \
            --set ingress.tls.secretName=gvdb-tls \
            --set 'ingress.annotations.nginx\.ingress\.kubernetes\.io/backend-protocol=GRPC')
          echo "$ing" | grep -q '^kind: Ingress$' || \
            { echo "ERROR: Ingress kind not emitted"; exit 1; }
          echo "$ing" | grep -q 'backend-protocol: GRPC' || \
            { echo "ERROR: gRPC backend-protocol annotation missing"; exit 1; }
          echo "$ing" | grep -q 'secretName: "gvdb-tls"' || \
            { echo "ERROR: TLS secret reference missing"; exit 1; }
          # GRPCRoute kind: Gateway API binding with the full set of
          # parentRefs fields exercised (namespace + sectionName) so the
          # optional {{- with }} branches don't silently regress.
          gr=$(helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.kind=GRPCRoute \
            --set ingress.host=gvdb.example.com \
            --set ingress.gateway.name=public-gw \
            --set ingress.gateway.namespace=gateway-system \
            --set ingress.gateway.sectionName=grpc)
          echo "$gr" | grep -q '^kind: GRPCRoute$' || \
            { echo "ERROR: GRPCRoute kind not emitted"; exit 1; }
          echo "$gr" | grep -q 'name: "public-gw"' || \
            { echo "ERROR: GRPCRoute parentRefs.name missing"; exit 1; }
          echo "$gr" | grep -q 'namespace: "gateway-system"' || \
            { echo "ERROR: GRPCRoute parentRefs.namespace missing"; exit 1; }
          echo "$gr" | grep -q 'sectionName: "grpc"' || \
            { echo "ERROR: GRPCRoute parentRefs.sectionName missing"; exit 1; }
          # Required host enforcement: enabling without ingress.host fails fast.
          if helm template gvdb deploy/helm/gvdb --set ingress.enabled=true 2>/dev/null; then
            echo "ERROR: ingress.enabled without ingress.host should fail"; exit 1
          fi
          # ingress.kind validation: a typo'd kind must fail-fast, not
          # silently fall through to Ingress.
          if helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.host=gvdb.example.com \
            --set ingress.kind=Route 2>/dev/null; then
            echo "ERROR: invalid ingress.kind should fail"; exit 1
          fi

      - name: helm template smoke (TLS / cert-manager + External Secrets)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # TLS on with cert-manager: a Certificate is emitted, the three
          # config-consuming workloads (coordinator, data-node, proxy) mount
          # the TLS secret at /etc/gvdb/tls and are started with --config,
          # and the rendered server config carries the tls block. The
          # query-node binary does not accept --config, so it gets neither
          # the flag nor the mounts; passing it either crashes the pod.
          tls=$(helm template gvdb deploy/helm/gvdb \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true)
          echo "$tls" | grep -q '^kind: Certificate$' || \
            { echo "ERROR: cert-manager Certificate not emitted"; exit 1; }
          echo "$tls" | grep -q 'cert_path: /etc/gvdb/tls/tls.crt' || \
            { echo "ERROR: server.tls block missing from config"; exit 1; }
          mounts=$(echo "$tls" | grep -c 'mountPath: /etc/gvdb/tls')
          if [ "$mounts" -ne 3 ]; then
            echo "ERROR: expected TLS mount on 3 workloads (coordinator, data-node, proxy), got $mounts"; exit 1
          fi
          if helm template gvdb deploy/helm/gvdb \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true \
            --show-only templates/query-node-statefulset.yaml \
            | grep -qE -- '--config|/etc/gvdb'; then
            echo "ERROR: query-node must not receive --config or config/TLS mounts (binary rejects --config)"; exit 1
          fi
          # A typo'd/empty issuer must fail fast rather than emit a dangling ref.
          if helm template gvdb deploy/helm/gvdb \
            --set tls.certManager.enabled=true \
            --set tls.certManager.issuerRef.name="" 2>/dev/null; then
            echo "ERROR: empty cert-manager issuer should fail"; exit 1
          fi
          # External Secrets: an ExternalSecret on the GA v1 API is emitted.
          es=$(helm template gvdb deploy/helm/gvdb \
            --set externalSecrets.enabled=true \
            --set externalSecrets.secretStoreRef.name=aws-sm)
          echo "$es" | grep -q '^kind: ExternalSecret$' || \
            { echo "ERROR: ExternalSecret not emitted"; exit 1; }
          echo "$es" | grep -q 'external-secrets.io/v1' || \
            { echo "ERROR: ExternalSecret not on the v1 API"; exit 1; }

      - name: helm template smoke (object store)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Object store on: the rendered server config carries the
          # storage.object_store block and the config-consuming workloads
          # (coordinator, data-node, proxy) are started with --config.
          os=$(helm template gvdb deploy/helm/gvdb \
            --set objectStore.enabled=true \
            --set objectStore.type=s3 \
            --set objectStore.endpoint=http://minio.storage.svc:9000 \
            --set objectStore.bucket=gvdb-segments)
          echo "$os" | grep -q 'object_store:' || \
            { echo "ERROR: storage.object_store block missing from config"; exit 1; }
          echo "$os" | grep -q 'bucket: "gvdb-segments"' || \
            { echo "ERROR: object_store.bucket missing from config"; exit 1; }
          cfgs=$(echo "$os" | grep -c -- '--config')
          if [ "$cfgs" -ne 3 ]; then
            echo "ERROR: expected --config on 3 workloads (coordinator, data-node, proxy), got $cfgs"; exit 1
          fi
          # Off by default: no object_store block leaks into the config.
          if helm template gvdb deploy/helm/gvdb | grep -q 'object_store:'; then
            echo "ERROR: object_store block rendered with objectStore.enabled=false"; exit 1
          fi

      # Render with every hardening gate flipped on, mimicking a
      # production overlay. Catches regressions in the new
      # NetworkPolicy / PodMonitor / zoneSpread paths.
      - name: helm template smoke (hardening overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          helm template gvdb deploy/helm/gvdb \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.proxy.clientCIDRs={10.0.0.0/8}' \
            --set metrics.serviceMonitor.enabled=true \
            --set preUpgradeHook.enabled=true \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true \
            --set tls.mutualTls=true \
            --set externalSecrets.enabled=true \
            --set externalSecrets.secretStoreRef.name=aws-sm \
            --set objectStore.enabled=true \
            --set objectStore.type=s3 \
            --set objectStore.endpoint=http://minio.storage.svc:9000 \
            --set objectStore.bucket=gvdb-segments \
            --set coordinator.replicas=3 \
            --set coordinator.zoneSpread.enabled=true \
            --set dataNode.zoneSpread.enabled=true \
            --set queryNode.zoneSpread.enabled=true \
            --set proxy.zoneSpread.enabled=true \
            --set priorityClasses.create=true \
            > /dev/null

      - name: Skip notice
        if: steps.filter.outputs.operator == 'false' && steps.filter.outputs.gvdb-chart == 'false'
        run: echo "No operator or gvdb chart changes — skipping"
