name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'deploy/**'
      - '*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every Linux job pins ubuntu-24.04, the base of deploy/Dockerfile. The C++
  # jobs build with Clang 22 and libc++ from apt.llvm.org
  # (tools/ci/install-llvm.sh), as the release image does.
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for C++ changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'proto/**'
              - 'test/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'tools/ci/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              # The SDK integration tests download this job's
              # gvdb-server artifact, so SDK-only changes also need the
              # server built here.
              - 'clients/python/**'
              - 'clients/rust/**'

      - name: Install system dependencies
        if: steps.filter.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          # Remove pre-installed libssl-dev: its OpenSSL 3.x headers
          # conflict with the AWS SDK's bundled aws-lc/s2n-tls build.
          sudo apt-get remove -y libssl-dev 2>/dev/null || true
          # CMake and Ninja come with the runner image (/usr/local/bin).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            libasio-dev \
            libopenblas-dev \
            liblapack-dev \
            zlib1g-dev \
            libcurl4-gnutls-dev

      # Clang 22, libc++, lld, libomp and clang-tidy from apt.llvm.org (the
      # ci preset uses cmake/toolchains/linux-clang-libcxx.cmake).
      - name: Install LLVM
        if: steps.filter.outputs.cpp == 'true'
        run: tools/ci/install-llvm.sh --tidy

      # Only pushes to main save the cache. A PR can read the caches of main
      # but not those of another PR, so PR copies only crowd the 10 GB cache
      # store until GitHub evicts the main entries. The key is stable, and
      # ccache itself detects changed compile commands.
      - name: Set up ccache
        if: steps.filter.outputs.cpp == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: clang
          max-size: 1G
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - name: Restore FetchContent sources
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/cache/restore@v5
        id: fc-cache
        with:
          path: |
            build/ci/_deps/*-src
            build/ci/_deps/*-subbuild
          key: fetchcontent-ci-${{ hashFiles('cmake/GvdbDependencies.cmake') }}
          restore-keys: |
            fetchcontent-ci-

      - name: Configure
        if: steps.filter.outputs.cpp == 'true'
        run: >
          cmake --preset ci
          ${{ steps.fc-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

      # Git history is over 90% of the compressed sources (3 GB for the AWS
      # SDK alone) and fills the 10 GB cache store, which then evicts the
      # ccache entries. A disconnected configure does not read it.
      - name: Drop git history from FetchContent sources
        if: steps.filter.outputs.cpp == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        run: find build/ci/_deps -name .git -prune -exec rm -rf {} +

      - name: Save FetchContent sources
        if: steps.filter.outputs.cpp == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/ci/_deps/*-src
            build/ci/_deps/*-subbuild
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      - name: Build
        if: steps.filter.outputs.cpp == 'true'
        run: cmake --build --preset ci

      # S3-compatible endpoint (adobe/s3mock) for object_store_s3_tests.
      - name: Start the S3 test endpoint
        if: steps.filter.outputs.cpp == 'true'
        run: docker compose -f test/integration/docker-compose.s3.yml up -d --wait

      - name: Test
        if: steps.filter.outputs.cpp == 'true'
        env:
          GVDB_TEST_S3_ENDPOINT: http://localhost:9000
        run: ctest --preset ci --parallel "$(nproc)"

      # The checks in .clang-tidy on every source file of the ci build, with
      # the clang-tidy of the toolchain's LLVM version. A hit fails the job.
      - name: Run clang-tidy
        if: steps.filter.outputs.cpp == 'true'
        run: |
          v=$(sed -n 's/^set(GVDB_LLVM_VERSION \([0-9][0-9]*\).*/\1/p' cmake/toolchains/linux-clang-libcxx.cmake)
          make tidy PRESET=ci RUN_CLANG_TIDY="run-clang-tidy-$v -clang-tidy-binary clang-tidy-$v"

      - name: Upload server binary
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gvdb-server
          path: build/ci/bin/gvdb-single-node
          retention-days: 1

      - name: Skip notice
        if: steps.filter.outputs.cpp == 'false'
        run: echo "No C++ changes detected, skipping build and test"

  # macOS with Apple clang, Apple's libc++ and the Metal backend. The Linux
  # jobs use Clang 22 and LLVM's libc++, so code that only one of the two
  # toolchains accepts fails in one of them. Tests with the gpu label need a
  # Metal device, which the hosted runner does not have.
  build-and-test-macos:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for C++ changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'proto/**'
              - 'test/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '.github/workflows/ci.yml'

      - name: Install dependencies
        if: steps.filter.outputs.cpp == 'true'
        run: brew install ninja ccache libomp zlib

      # Only pushes to main save the cache. A PR can read the caches of main
      # but not those of another PR, so PR copies only crowd the 10 GB cache
      # store until GitHub evicts the main entries. The key is stable, and
      # ccache itself detects changed compile commands.
      - name: Set up ccache
        if: steps.filter.outputs.cpp == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos
          max-size: 1G
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - name: Restore FetchContent sources
        if: steps.filter.outputs.cpp == 'true'
        uses: actions/cache/restore@v5
        id: fc-cache
        with:
          path: |
            build/metal/_deps/*-src
            build/metal/_deps/*-subbuild
          key: fetchcontent-macos-${{ hashFiles('cmake/GvdbDependencies.cmake') }}
          restore-keys: |
            fetchcontent-macos-

      - name: Configure
        if: steps.filter.outputs.cpp == 'true'
        run: >
          cmake --preset metal
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ steps.fc-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

      # Git history is over 90% of the compressed sources. A disconnected
      # configure does not read it.
      - name: Drop git history from FetchContent sources
        if: steps.filter.outputs.cpp == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        run: find build/metal/_deps -name .git -prune -exec rm -rf {} +

      - name: Save FetchContent sources
        if: steps.filter.outputs.cpp == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/metal/_deps/*-src
            build/metal/_deps/*-subbuild
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      - name: Build
        if: steps.filter.outputs.cpp == 'true'
        run: cmake --build --preset metal

      - name: Test
        if: steps.filter.outputs.cpp == 'true'
        run: ctest --preset metal --parallel "$(sysctl -n hw.ncpu)" -LE gpu

      - name: Skip notice
        if: steps.filter.outputs.cpp == 'false'
        run: echo "No C++ changes detected, skipping the macOS build"

  # Builds the release image from deploy/Dockerfile when the image or the
  # build configuration changes, and makes sure that the programs do not
  # need a C++ standard library on the host.
  docker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for image changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # The image build has no cache on a fresh runner and compiles every
          # dependency, about 40 minutes. It runs only for changes that only
          # the image build tests. build-and-test already compiles CMake and
          # source changes with the same Clang, libc++ and static linking.
          filters: |
            image:
              - 'deploy/Dockerfile'
              - '.dockerignore'
              - 'CMakePresets.json'
              - 'cmake/toolchains/**'
              - 'tools/ci/install-llvm.sh'

      - name: Build the release image
        if: steps.filter.outputs.image == 'true'
        run: docker build -f deploy/Dockerfile -t gvdb:ci .

      - name: Run the programs in the image
        if: steps.filter.outputs.image == 'true'
        run: |
          for bin in gvdb-single-node gvdb-coordinator gvdb-data-node gvdb-query-node gvdb-proxy; do
            docker run --rm --entrypoint ldd gvdb:ci "/usr/local/bin/$bin" > "ldd-$bin.txt"
            cat "ldd-$bin.txt"
            if grep -E 'not found|libc\+\+|libstdc\+\+' "ldd-$bin.txt"; then
              echo "::error::$bin needs a library that the image does not provide, or links a C++ standard library dynamically"
              exit 1
            fi
            # Every program prints its usage for --help, then exits with 1,
            # so the step looks for the usage line.
            if ! docker run --rm --entrypoint "/usr/local/bin/$bin" gvdb:ci --help 2>&1 | grep -q '^Usage:'; then
              echo "::error::$bin did not start in the image"
              exit 1
            fi
          done

      - name: Skip notice
        if: steps.filter.outputs.image == 'false'
        run: echo "No image changes detected, skipping the image build"

  # ==========================================================================
  # GCS backend build lane
  # ==========================================================================
  # Compiles and links the -DGVDB_WITH_GCS=ON path against a real
  # google-cloud-cpp (storage), which the default build does not exercise.
  # Only google-cloud-cpp comes from vcpkg (the sole find_package consumer);
  # every other dependency still uses the project's FetchContent, so this
  # lane's real job is to surface any abseil diamond (gvdb's FetchContent
  # abseil vs the one vcpkg's google-cloud-cpp pulls) that would only appear
  # at executable link time. Gated to GCS-relevant changes so the heavy
  # vcpkg build does not run on every PR.
  gcs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for GCS-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gcs:
              - 'src/storage/objstore/gcs_object_store.cpp'
              - 'src/storage/objstore/gcs_object_store.h'
              - 'src/storage/objstore/object_store_factory.cpp'
              - 'src/storage/objstore/object_store_factory.h'
              - 'src/storage/CMakeLists.txt'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'test/CMakeLists.txt'
              - 'test/unit/CMakeLists.txt'
              - 'test/unit/storage/CMakeLists.txt'
              - 'test/unit/storage/object_store_*'
              - 'test/integration/docker-compose.fake-gcs.yml'
              - 'test/integration/fake-gcs-seed/**'
              - 'tools/ci/**'
              - 'tools/vcpkg/**'
              - '.github/workflows/ci.yml'

      - name: Install system dependencies
        if: steps.filter.outputs.gcs == 'true'
        run: |
          sudo apt-get update
          # CMake and Ninja come with the runner image (/usr/local/bin).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            curl zip unzip tar \
            pkg-config \
            libasio-dev \
            libopenblas-dev \
            liblapack-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Install LLVM
        if: steps.filter.outputs.gcs == 'true'
        run: tools/ci/install-llvm.sh

      # Only pushes to main save the cache. A PR can read the caches of main
      # but not those of another PR, so PR copies only crowd the 10 GB cache
      # store until GitHub evicts the main entries. The key is stable, and
      # ccache itself detects changed compile commands.
      # Without a GCS entry, the lane starts from the Linux cache.
      - name: Set up ccache
        if: steps.filter.outputs.gcs == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gcs-clang
          restore-keys: |
            clang
          max-size: 1G
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - name: Set up vcpkg
        if: steps.filter.outputs.gcs == 'true'
        run: |
          # Pin vcpkg to a known commit for reproducible google-cloud-cpp
          # versions. Bump deliberately, not implicitly.
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout 2024.12.16
          "$HOME/vcpkg"/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary artifacts
        if: steps.filter.outputs.gcs == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-gcs-${{ runner.os }}-2024.12.16-clang-libcxx-${{ hashFiles('cmake/toolchains/**', 'tools/vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-gcs-${{ runner.os }}-2024.12.16-clang-libcxx-

      # The triplet builds google-cloud-cpp with the same Clang and libc++ as
      # GVDB, because both link into one program.
      - name: Install google-cloud-cpp (storage)
        if: steps.filter.outputs.gcs == 'true'
        run: |
          "$VCPKG_ROOT"/vcpkg install "google-cloud-cpp[core,storage]" \
            --triplet x64-linux-clang-libcxx \
            --overlay-triplets "$GITHUB_WORKSPACE/tools/vcpkg/triplets"

      - name: Restore FetchContent sources
        if: steps.filter.outputs.gcs == 'true'
        uses: actions/cache/restore@v5
        id: fc-cache
        with:
          path: |
            build/gcs/_deps/*-src
            build/gcs/_deps/*-subbuild
          key: fetchcontent-gcs-${{ hashFiles('cmake/GvdbDependencies.cmake') }}
          restore-keys: |
            fetchcontent-gcs-

      # The gcs preset takes the vcpkg toolchain file from $VCPKG_ROOT.
      - name: Configure (GVDB_WITH_GCS=ON)
        if: steps.filter.outputs.gcs == 'true'
        run: >
          cmake --preset gcs
          ${{ steps.fc-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

      # Git history is over 90% of the compressed sources. A disconnected
      # configure does not read it.
      - name: Drop git history from FetchContent sources
        if: steps.filter.outputs.gcs == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        run: find build/gcs/_deps -name .git -prune -exec rm -rf {} +

      - name: Save FetchContent sources
        if: steps.filter.outputs.gcs == 'true' && github.event_name == 'push' && steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/gcs/_deps/*-src
            build/gcs/_deps/*-subbuild
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      # Stage 1, compile-check: builds gvdb_storage (a static lib), which
      # compiles gcs_object_store.cpp against the real google-cloud-cpp
      # headers. Validates the SDK API usage without touching the link-time
      # abseil diamond. This is the primary signal.
      - name: Build gvdb_storage (GCS compile-check)
        if: steps.filter.outputs.gcs == 'true'
        run: cmake --build --preset gcs --target gvdb_storage

      # Stage 2, link-check: links gvdb-single-node, which pulls both
      # google-cloud-cpp (+ its abseil) and gRPC (+ the FetchContent abseil)
      # into one executable. A duplicate-symbol / ODR failure here is the
      # abseil diamond and tells us the find_package integration needs
      # dependency convergence.
      - name: Build gvdb-single-node (GCS link-check)
        if: steps.filter.outputs.gcs == 'true'
        run: cmake --build --preset gcs --target gvdb-single-node

      # Stage 3: the object store contract against a GCS emulator, plus the
      # factory tests with GCS compiled in.
      - name: Build the object store tests
        if: steps.filter.outputs.gcs == 'true'
        run: cmake --build --preset gcs --target storage_tests object_store_gcs_tests

      - name: Start the GCS emulator
        if: steps.filter.outputs.gcs == 'true'
        run: docker compose -f test/integration/docker-compose.fake-gcs.yml up -d --wait

      - name: Run the object store tests
        if: steps.filter.outputs.gcs == 'true'
        env:
          GVDB_TEST_GCS_ENDPOINT: http://localhost:4443
        run: >
          ctest --preset gcs
          -R '^object_store_gcs_tests$|^storage_tests:(ObjectStore contract|InMemoryObjectStore|FilesystemObjectStore|CreateObjectStore)'

      - name: Skip notice
        if: steps.filter.outputs.gcs == 'false'
        run: echo "No GCS-relevant changes, skipping GCS build lane"

  test-python-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for Python SDK changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # The SDK tests run against the server built in build-and-test,
            # so server changes run them too.
            python:
              - 'clients/python/**'
              - 'proto/**'
              - 'src/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'tools/ci/**'

      - name: Install uv
        if: steps.filter.outputs.python == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download server binary
        if: steps.filter.outputs.python == 'true'
        uses: actions/download-artifact@v8
        with:
          name: gvdb-server
          path: build/ci/bin

      - name: Make server executable
        if: steps.filter.outputs.python == 'true'
        run: chmod +x build/ci/bin/gvdb-single-node

      # The server links libc++ statically. It needs the OpenMP runtime of the
      # LLVM version it was built with: Ubuntu's libomp5 is older and lacks
      # symbols that Clang 22 code calls.
      - name: Install runtime deps
        if: steps.filter.outputs.python == 'true'
        run: |
          tools/ci/install-llvm.sh --runtime
          sudo apt-get install -y --no-install-recommends libopenblas0 liblapack3

      - name: Install Python SDK deps
        if: steps.filter.outputs.python == 'true'
        run: cd clients/python && uv sync

      - name: Lint Python SDK
        if: steps.filter.outputs.python == 'true'
        run: make lint-sdk

      - name: Run Python SDK tests
        if: steps.filter.outputs.python == 'true'
        run: make test-sdk PRESET=ci

      - name: Skip notice
        if: steps.filter.outputs.python == 'false'
        run: echo "No Python SDK changes, skipping"

  test-rust-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for Rust SDK changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # The SDK tests run against the server built in build-and-test,
            # so server changes run them too.
            rust:
              - 'clients/rust/**'
              - 'proto/**'
              - 'src/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'tools/ci/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Set up Rust
        if: steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        if: steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust

      - name: Download server binary
        if: steps.filter.outputs.rust == 'true'
        uses: actions/download-artifact@v8
        with:
          name: gvdb-server
          path: build/ci/bin

      - name: Make server executable
        if: steps.filter.outputs.rust == 'true'
        run: chmod +x build/ci/bin/gvdb-single-node

      # The server links libc++ statically and needs the matching LLVM OpenMP
      # runtime. The Rust build script needs protoc to compile vectordb.proto.
      - name: Install runtime and proto deps
        if: steps.filter.outputs.rust == 'true'
        run: |
          tools/ci/install-llvm.sh --runtime
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas0 liblapack3 protobuf-compiler

      - name: Check default features build
        if: steps.filter.outputs.rust == 'true'
        run: cd clients/rust && cargo check --no-default-features

      - name: Lint and test Rust SDK
        if: steps.filter.outputs.rust == 'true'
        run: make test-rust-sdk PRESET=ci

      - name: Skip notice
        if: steps.filter.outputs.rust == 'false'
        run: echo "No Rust SDK changes, skipping"

  test-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for operator changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            operator:
              - 'operator/**'
              - 'deploy/helm/gvdb-operator/**'
              - 'proto/**'
            gvdb-chart:
              - 'deploy/helm/gvdb/**'

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: operator/go.sum

      - name: Vet
        if: steps.filter.outputs.operator == 'true'
        run: cd operator && go vet ./...

      - name: Unit tests (render + controller pure logic)
        if: steps.filter.outputs.operator == 'true'
        run: make test-operator

      - name: envtest (reconciler against fake apiserver)
        if: steps.filter.outputs.operator == 'true'
        run: cd operator && make test

      - name: Build operator binary
        if: steps.filter.outputs.operator == 'true'
        run: make build-operator

      - name: Lint Helm chart
        if: steps.filter.outputs.operator == 'true'
        run: helm lint deploy/helm/gvdb-operator

      # Mirror of the gvdb chart guard: a bare `gvdb-operator:tag` would
      # resolve to docker.io/library/gvdb-operator on any fresh cluster
      # and break the published `helm install oci://ghcr.io/...` path
      # with ImagePullBackOff.
      - name: helm template default image has registry (operator)
        if: steps.filter.outputs.operator == 'true'
        run: |
          if helm template gvdb-operator deploy/helm/gvdb-operator | grep -E '^\s+image: "?[^/]+:'; then
            echo "ERROR: rendered operator image lacks a registry prefix"
            exit 1
          fi

      - name: Lint gvdb chart
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: helm lint deploy/helm/gvdb

      # Render with default values to catch templating regressions that
      # would change the dev/kind install behavior. Hardening primitives
      # are gated, so the default render must remain stable.
      - name: helm template smoke (default values)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: helm template gvdb deploy/helm/gvdb > /dev/null

      # Guard against image.repository regressing to a registry-less
      # string. A bare `gvdb:tag` resolves to docker.io/library/gvdb on
      # any fresh cluster and breaks the published `helm install
      # oci://ghcr.io/...` path with ImagePullBackOff.
      - name: helm template default image has registry
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          if helm template gvdb deploy/helm/gvdb | grep -E '^\s+image: "[^/]+:'; then
            echo "ERROR: rendered image lacks a registry prefix"
            exit 1
          fi

      - name: helm template smoke (EKS overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            -f deploy/helm/gvdb/values-eks.yaml)
          # The overlay's whole point is that NLB annotations and gp3
          # storage classes land in the rendered output. If the proxy
          # service template or a workload's storage block stops plumbing
          # these, the overlay becomes a no-op and we want the build to
          # fail loudly.
          echo "$out" | grep -q 'aws-load-balancer-scheme: internal' || \
            { echo "ERROR: proxy NLB annotations missing from EKS overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "gp3"' || \
            { echo "ERROR: gp3 storageClassName missing from EKS overlay render"; exit 1; }

      - name: helm template smoke (GKE overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            -f deploy/helm/gvdb/values-gke.yaml)
          # The overlay must plumb the GKE internal-LB annotation and the PD
          # storage classes into the render; if a template stops threading
          # them the overlay silently no-ops, so fail loudly.
          echo "$out" | grep -q 'networking.gke.io/load-balancer-type: Internal' || \
            { echo "ERROR: internal LB annotation missing from GKE overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "premium-rwo"' || \
            { echo "ERROR: premium-rwo storageClassName missing from GKE overlay render"; exit 1; }
          echo "$out" | grep -q 'storageClassName: "standard-rwo"' || \
            { echo "ERROR: standard-rwo storageClassName missing from GKE overlay render"; exit 1; }

      - name: helm template smoke (pre-upgrade hook)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          out=$(helm template gvdb deploy/helm/gvdb \
            --set preUpgradeHook.enabled=true)
          # Hook is gated on a single flag; when enabled it must emit the
          # SA + Role + RoleBinding + Job all annotated with helm.sh/hook
          # pre-upgrade. Catches regressions where the gate, RBAC, or
          # hook annotations get dropped silently.
          echo "$out" | grep -qE 'helm\.sh/hook: "?pre-upgrade"?' || \
            { echo "ERROR: pre-upgrade hook annotation missing"; exit 1; }
          echo "$out" | grep -q 'name: gvdb-pre-upgrade$' || \
            { echo "ERROR: pre-upgrade ServiceAccount/Role/RoleBinding missing"; exit 1; }
          echo "$out" | grep -q 'kubectl .* rollout status' || \
            { echo "ERROR: pre-upgrade Job rollout check missing"; exit 1; }

      - name: helm template smoke (pod hardening)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Component label must land on every workload's pods, and the
          # per-workload nodeSelector / tolerations / podAnnotations
          # must thread into the rendered pod spec when set.
          out=$(helm template gvdb deploy/helm/gvdb \
            --set 'coordinator.nodeSelector.role=gvdb' \
            --set 'dataNode.tolerations[0].key=dedicated' \
            --set 'dataNode.tolerations[0].operator=Exists' \
            --set 'proxy.podAnnotations.example\.io/scrape=true')
          for c in coordinator data-node query-node proxy; do
            echo "$out" | grep -q "app.kubernetes.io/component: $c" || \
              { echo "ERROR: component label missing for $c"; exit 1; }
          done
          echo "$out" | grep -q 'role: gvdb' || \
            { echo "ERROR: coordinator.nodeSelector not threaded into pod spec"; exit 1; }
          echo "$out" | grep -q 'key: dedicated' || \
            { echo "ERROR: dataNode.tolerations not threaded into pod spec"; exit 1; }
          echo "$out" | grep -q 'example.io/scrape:' || \
            { echo "ERROR: proxy.podAnnotations not threaded into pod template"; exit 1; }

      - name: helm template smoke (ingress + GRPCRoute)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Ingress kind: legacy nginx-style with gRPC backend-protocol
          # annotation, IngressClass and TLS secret reference.
          ing=$(helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.host=gvdb.example.com \
            --set ingress.className=nginx \
            --set ingress.tls.secretName=gvdb-tls \
            --set 'ingress.annotations.nginx\.ingress\.kubernetes\.io/backend-protocol=GRPC')
          echo "$ing" | grep -q '^kind: Ingress$' || \
            { echo "ERROR: Ingress kind not emitted"; exit 1; }
          echo "$ing" | grep -q 'backend-protocol: GRPC' || \
            { echo "ERROR: gRPC backend-protocol annotation missing"; exit 1; }
          echo "$ing" | grep -q 'secretName: "gvdb-tls"' || \
            { echo "ERROR: TLS secret reference missing"; exit 1; }
          # GRPCRoute kind: Gateway API binding with the full set of
          # parentRefs fields exercised (namespace + sectionName) so the
          # optional {{- with }} branches don't silently regress.
          gr=$(helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.kind=GRPCRoute \
            --set ingress.host=gvdb.example.com \
            --set ingress.gateway.name=public-gw \
            --set ingress.gateway.namespace=gateway-system \
            --set ingress.gateway.sectionName=grpc)
          echo "$gr" | grep -q '^kind: GRPCRoute$' || \
            { echo "ERROR: GRPCRoute kind not emitted"; exit 1; }
          echo "$gr" | grep -q 'name: "public-gw"' || \
            { echo "ERROR: GRPCRoute parentRefs.name missing"; exit 1; }
          echo "$gr" | grep -q 'namespace: "gateway-system"' || \
            { echo "ERROR: GRPCRoute parentRefs.namespace missing"; exit 1; }
          echo "$gr" | grep -q 'sectionName: "grpc"' || \
            { echo "ERROR: GRPCRoute parentRefs.sectionName missing"; exit 1; }
          # Required host enforcement: enabling without ingress.host fails fast.
          if helm template gvdb deploy/helm/gvdb --set ingress.enabled=true 2>/dev/null; then
            echo "ERROR: ingress.enabled without ingress.host should fail"; exit 1
          fi
          # ingress.kind validation: a typo'd kind must fail-fast, not
          # silently fall through to Ingress.
          if helm template gvdb deploy/helm/gvdb \
            --set ingress.enabled=true \
            --set ingress.host=gvdb.example.com \
            --set ingress.kind=Route 2>/dev/null; then
            echo "ERROR: invalid ingress.kind should fail"; exit 1
          fi

      - name: helm template smoke (TLS / cert-manager + External Secrets)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # TLS on with cert-manager: a Certificate is emitted, the three
          # config-consuming workloads (coordinator, data-node, proxy) mount
          # the TLS secret at /etc/gvdb/tls and are started with --config,
          # and the rendered server config carries the tls block. The
          # query-node binary does not accept --config, so it gets neither
          # the flag nor the mounts; passing it either crashes the pod.
          tls=$(helm template gvdb deploy/helm/gvdb \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true)
          echo "$tls" | grep -q '^kind: Certificate$' || \
            { echo "ERROR: cert-manager Certificate not emitted"; exit 1; }
          echo "$tls" | grep -q 'cert_path: /etc/gvdb/tls/tls.crt' || \
            { echo "ERROR: server.tls block missing from config"; exit 1; }
          mounts=$(echo "$tls" | grep -c 'mountPath: /etc/gvdb/tls')
          if [ "$mounts" -ne 3 ]; then
            echo "ERROR: expected TLS mount on 3 workloads (coordinator, data-node, proxy), got $mounts"; exit 1
          fi
          if helm template gvdb deploy/helm/gvdb \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true \
            --show-only templates/query-node-statefulset.yaml \
            | grep -qE -- '--config|/etc/gvdb'; then
            echo "ERROR: query-node must not receive --config or config/TLS mounts (binary rejects --config)"; exit 1
          fi
          # A typo'd/empty issuer must fail fast rather than emit a dangling ref.
          if helm template gvdb deploy/helm/gvdb \
            --set tls.certManager.enabled=true \
            --set tls.certManager.issuerRef.name="" 2>/dev/null; then
            echo "ERROR: empty cert-manager issuer should fail"; exit 1
          fi
          # External Secrets: an ExternalSecret on the GA v1 API is emitted.
          es=$(helm template gvdb deploy/helm/gvdb \
            --set externalSecrets.enabled=true \
            --set externalSecrets.secretStoreRef.name=aws-sm)
          echo "$es" | grep -q '^kind: ExternalSecret$' || \
            { echo "ERROR: ExternalSecret not emitted"; exit 1; }
          echo "$es" | grep -q 'external-secrets.io/v1' || \
            { echo "ERROR: ExternalSecret not on the v1 API"; exit 1; }

      - name: helm template smoke (object store)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          # Object store on: the rendered server config carries the
          # storage.object_store block and the config-consuming workloads
          # (coordinator, data-node, proxy) are started with --config.
          os=$(helm template gvdb deploy/helm/gvdb \
            --set objectStore.enabled=true \
            --set objectStore.type=s3 \
            --set objectStore.endpoint=http://minio.storage.svc:9000 \
            --set objectStore.bucket=gvdb-segments)
          echo "$os" | grep -q 'object_store:' || \
            { echo "ERROR: storage.object_store block missing from config"; exit 1; }
          echo "$os" | grep -q 'bucket: "gvdb-segments"' || \
            { echo "ERROR: object_store.bucket missing from config"; exit 1; }
          cfgs=$(echo "$os" | grep -c -- '--config')
          if [ "$cfgs" -ne 3 ]; then
            echo "ERROR: expected --config on 3 workloads (coordinator, data-node, proxy), got $cfgs"; exit 1
          fi
          # Off by default: no object_store block leaks into the config.
          if helm template gvdb deploy/helm/gvdb | grep -q 'object_store:'; then
            echo "ERROR: object_store block rendered with objectStore.enabled=false"; exit 1
          fi

      # Render with every hardening gate flipped on, mimicking a
      # production overlay. Catches regressions in the new
      # NetworkPolicy / PodMonitor / zoneSpread paths.
      - name: helm template smoke (hardening overlay)
        if: steps.filter.outputs.gvdb-chart == 'true'
        run: |
          helm template gvdb deploy/helm/gvdb \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.proxy.clientCIDRs={10.0.0.0/8}' \
            --set metrics.serviceMonitor.enabled=true \
            --set preUpgradeHook.enabled=true \
            --set tls.enabled=true \
            --set tls.certManager.enabled=true \
            --set tls.mutualTls=true \
            --set externalSecrets.enabled=true \
            --set externalSecrets.secretStoreRef.name=aws-sm \
            --set objectStore.enabled=true \
            --set objectStore.type=s3 \
            --set objectStore.endpoint=http://minio.storage.svc:9000 \
            --set objectStore.bucket=gvdb-segments \
            --set coordinator.replicas=3 \
            --set coordinator.zoneSpread.enabled=true \
            --set dataNode.zoneSpread.enabled=true \
            --set queryNode.zoneSpread.enabled=true \
            --set proxy.zoneSpread.enabled=true \
            --set priorityClasses.create=true \
            > /dev/null

      - name: Skip notice
        if: steps.filter.outputs.operator == 'false' && steps.filter.outputs.gvdb-chart == 'false'
        run: echo "No operator or gvdb chart changes, skipping"

  # The checked-in protobuf stubs (Python SDK, operator, UI gateway) must match
  # proto/*.proto. The job generates them again with the pinned generators and
  # fails on any difference.
  proto-stubs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for proto changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'tools/proto/**'
              - 'clients/python/gvdb/pb/**'
              - 'clients/python/uv.lock'
              - 'operator/internal/gvdbpb/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Set up Go
        if: steps.filter.outputs.proto == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install the pinned generators
        if: steps.filter.outputs.proto == 'true'
        run: |
          source tools/proto/versions.env
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        if: steps.filter.outputs.proto == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Generate the stubs
        if: steps.filter.outputs.proto == 'true'
        run: make proto

      - name: Fail on stale stubs
        if: steps.filter.outputs.proto == 'true'
        run: |
          if ! git diff --exit-code; then
            echo "::error::The checked-in protobuf stubs differ from proto/. Run 'make proto' and commit the result."
            exit 1
          fi

      - name: Skip notice
        if: steps.filter.outputs.proto == 'false'
        run: echo "No proto or stub changes, skipping the stub check"

  # Every module in src/ includes only the modules before it in the layer
  # order. All modules share one include root, so the build cannot catch a
  # forbidden include.
  layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the module layers
        run: python3 tools/check_layers.py

  # The C++ sources in src/ and test/ match .clang-format.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      # The Makefile pins the clang-format version.
      - name: Check the C++ format
        run: make check-format
