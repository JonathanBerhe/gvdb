# AWS EKS overlay for the gvdb chart.
#
# Compose with your workload-sizing values to install on EKS:
#   helm install gvdb oci://ghcr.io/jonathanberhe/charts/gvdb \
#     -f values-eks.yaml -f my-prod.yaml
#
# Scope: only AWS/EKS specifics (storage classes, NLB annotations, IRSA
# ServiceAccount placeholders, zone spread). Replica counts, resource
# sizing, and security contexts belong in your prod values overlay since
# they are workload-driven, not cloud-driven.
#
# Prerequisites on the cluster:
#   - AWS Load Balancer Controller installed (for the NLB annotations to
#     take effect; the in-tree cloud controller works too but the
#     annotation set differs).
#   - A `gp3` StorageClass defined (the EBS CSI add-on installs gp2 by
#     default on EKS 1.23+; create a gp3 SC and mark it default for the
#     best price/perf, or override `<workload>.storage.storageClass`).
#   - IRSA OIDC provider configured for the cluster, with IAM roles for
#     the data-node and (optionally) coordinator that grant the S3 access
#     they need for tiered storage / backups.

coordinator:
  storage:
    storageClass: gp3
  zoneSpread:
    enabled: true
  serviceAccount:
    create: true
    annotations:
      # Fill in for coordinator-side backup destination access if you put
      # backup manifests in S3:
      # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/gvdb-coordinator
      {}

dataNode:
  storage:
    # gp3 is the price/perf default. Swap to io2 (or io2-block-express)
    # for very write-heavy clusters that need sustained >16K IOPS.
    storageClass: gp3
  zoneSpread:
    enabled: true
  serviceAccount:
    create: true
    annotations:
      # Required when tiered storage points at S3 / MinIO running on
      # S3. Fill in the IRSA role:
      # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/gvdb-data-node
      {}

queryNode:
  storage:
    storageClass: gp3
  zoneSpread:
    enabled: true

proxy:
  service:
    type: LoadBalancer
    annotations:
      # AWS Load Balancer Controller annotations. `external` opts out of
      # the in-tree controller; `ip` targets pod ENIs directly (works
      # with the VPC CNI and avoids a hop through node ports). Defaults
      # to an internal-only LB. Flip the scheme to `internet-facing` if
      # you really want the proxy reachable from the public internet
      # (combine with TLS + RBAC).
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  zoneSpread:
    enabled: true
