image:
  repository: gvdb
  tag: ""          # defaults to Chart appVersion
  pullPolicy: IfNotPresent

coordinator:
  # Set replicas: 3 (or 5, 7...) for Raft HA. Each pod derives its node-id
  # from the StatefulSet ordinal + 1, and --raft-peers is populated from
  # the headless service DNS in "id:host:port" format (roadmap 0b.4).
  # replicas: 1 keeps --single-node mode (dev / kind default).
  replicas: 1
  # Legacy toggle retained for clarity — ignored when replicas > 1.
  singleNode: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  storage:
    size: 1Gi
    storageClass: ""

dataNode:
  replicas: 2
  memoryLimitGb: 4
  # Seconds between SIGTERM and SIGKILL. Pod uses this window to send a
  # draining heartbeat to the coordinator, wait for in-flight index builds
  # to finish (IVF can take tens of seconds), and close gRPC connections
  # cleanly (roadmap 0b.1).
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  storage:
    size: 5Gi
    storageClass: ""

queryNode:
  replicas: 1
  memoryLimitGb: 4
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  storage:
    size: 2Gi
    storageClass: ""

proxy:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 50050
    nodePort: ""

config:
  server:
    maxMessageSizeMb: 256
    maxConcurrentStreams: 1000
  storage:
    segmentMaxSizeMb: 512
    walBufferSizeMb: 64
    enableCompression: true
    compactionThreads: 2
  index:
    defaultIndexType: "HNSW"
    hnswM: 16
    hnswEfConstruction: 200
    hnswEfSearch: 100
  logging:
    level: "info"
    consoleEnabled: true
    fileEnabled: false

ui:
  enabled: false
  image:
    repository: ghcr.io/jonathanberhe/gvdb-ui
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080
