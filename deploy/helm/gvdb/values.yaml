image:
  repository: gvdb
  tag: ""          # defaults to Chart appVersion
  pullPolicy: IfNotPresent

# K8s cluster DNS domain. Defaults to cluster.local; override for clusters
# using a custom domain (e.g. "cluster.internal") so FQDNs in the chart
# resolve correctly (roadmap 0b.5).
clusterDomain: cluster.local

coordinator:
  # Set replicas: 3 (or 5, 7...) for Raft HA. Each pod derives its node-id
  # from the StatefulSet ordinal + 1, and --raft-peers is populated from
  # the headless service DNS in "id:host:port" format (roadmap 0b.4).
  # replicas: 1 keeps --single-node mode (dev / kind default).
  replicas: 1
  # Legacy toggle retained for clarity — ignored when replicas > 1.
  singleNode: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  storage:
    size: 1Gi
    storageClass: ""
  # Production hardening primitives (roadmap 0b.5). All default off so the
  # dev / kind install is unchanged. Enable in a values-prod.yaml overlay.
  podDisruptionBudget:
    # Prevents voluntary disruptions (drain, cluster-autoscaler) from
    # evicting too many replicas at once. Default off so dev/kind with 1
    # replica isn't blocked by an unsatisfiable budget. For HA Raft
    # quorum, set minAvailable = replicas - 1 (e.g. 2 for replicas: 3) —
    # otherwise K8s can evict enough pods to break quorum. Chart
    # validates minAvailable <= replicas and fails fast otherwise.
    enabled: false
    minAvailable: 1
  podAntiAffinity:
    enabled: false
    type: preferred  # "preferred" (soft) or "required" (hard)
    topologyKey: kubernetes.io/hostname  # e.g. topology.kubernetes.io/zone for AZ spread
  topologySpreadConstraints: []  # user-provided raw list, e.g. AZ spread
  serviceAccount:
    create: false
    name: ""
    annotations: {}  # populate with IRSA / Workload Identity / Azure WI
  priorityClassName: ""  # set to <release>-coordinator when priorityClasses.create=true

dataNode:
  replicas: 2
  memoryLimitGb: 4
  # Seconds between SIGTERM and SIGKILL. Pod uses this window to send a
  # draining heartbeat to the coordinator, wait for in-flight index builds
  # to finish (IVF can take tens of seconds), and close gRPC connections
  # cleanly (roadmap 0b.1).
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  storage:
    size: 5Gi
    storageClass: ""
  # Hardening (roadmap 0b.5) — same shape as coordinator.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  podAntiAffinity:
    enabled: false
    type: preferred
    topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}  # e.g. eks.amazonaws.com/role-arn: ... for S3 access
  priorityClassName: ""

queryNode:
  replicas: 1
  memoryLimitGb: 4
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  storage:
    size: 2Gi
    storageClass: ""
  # Hardening (roadmap 0b.5).
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  podAntiAffinity:
    enabled: false
    type: preferred
    topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  priorityClassName: ""

proxy:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 50050
    nodePort: ""
  # Hardening (roadmap 0b.5).
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  podAntiAffinity:
    enabled: false
    type: preferred
    topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  priorityClassName: ""

# Pod- and container-level security contexts applied to every workload
# (roadmap 0b.5). Empty by default to preserve existing behavior; populate
# in a production values overlay, e.g.:
#   security:
#     podSecurityContext:
#       runAsNonRoot: true
#       runAsUser: 1000
#       fsGroup: 1000
#       seccompProfile: {type: RuntimeDefault}
#     containerSecurityContext:
#       allowPrivilegeEscalation: false
#       capabilities: {drop: [ALL]}
#       # readOnlyRootFilesystem: true is SUPPORTED by the chart because
#       # the default --data-dir for every workload is /data/gvdb/* which
#       # is backed by a PVC mount and remains writable regardless of the
#       # root filesystem mode. Confirm your container image doesn't write
#       # to other root paths (e.g. /tmp via a third-party library) before
#       # enabling; if it does, mount an emptyDir on /tmp.
security:
  podSecurityContext: {}
  containerSecurityContext: {}

# PriorityClass objects for each workload (roadmap 0b.5). Cluster-scoped
# resource — only create when ops explicitly allow it. Defaults reserve
# headroom under the K8s system-cluster-critical value (2000000000).
priorityClasses:
  create: false
  coordinator:
    value: 1000000
  dataNode:
    value: 900000
  queryNode:
    value: 800000
  proxy:
    value: 700000

config:
  server:
    maxMessageSizeMb: 256
    maxConcurrentStreams: 1000
  storage:
    segmentMaxSizeMb: 512
    walBufferSizeMb: 64
    enableCompression: true
    compactionThreads: 2
  index:
    defaultIndexType: "HNSW"
    hnswM: 16
    hnswEfConstruction: 200
    hnswEfSearch: 100
  logging:
    level: "info"
    consoleEnabled: true
    fileEnabled: false

ui:
  enabled: false
  image:
    repository: ghcr.io/jonathanberhe/gvdb-ui
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080
