{{- if .Values.externalSecrets.enabled }}
{{- $target := .Values.externalSecrets.target.name | default (printf "%s-secrets" (include "gvdb.fullname" .)) -}}
# External Secrets Operator resource. Syncs secrets from a cloud provider
# (AWS Secrets Manager / GCP Secret Manager / Azure Key Vault / Vault) into the
# Kubernetes Secret named below, via a (Cluster)SecretStore you configure.
# Requires external-secrets.io CRDs installed in the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gvdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ $target }}
    creationPolicy: Owner
  {{- with .Values.externalSecrets.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
