{{/*
PodDisruptionBudget templates (roadmap 0b.5).

One PDB per workload, all opt-in. In HA topologies these prevent
`kubectl drain` / cluster-autoscaler from evicting too many replicas at
once. Defaults off so dev/kind (1 replica per workload) isn't blocked by
an unsatisfiable PDB.

Each block uses `minAvailable` — operators who prefer `maxUnavailable`
can override in their own values file.
*/}}

{{- if .Values.coordinator.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gvdb.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.coordinator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.coordinator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gvdb.coordinator.selectorLabels" . | nindent 6 }}
{{- end }}

