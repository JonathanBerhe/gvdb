{{/*
PodDisruptionBudget templates (roadmap 0b.5).

One PDB per workload, all opt-in. In HA topologies these prevent
`kubectl drain` / cluster-autoscaler from evicting too many replicas at
once. Defaults off so dev/kind (1 replica per workload) isn't blocked by
an unsatisfiable PDB.

Each block uses `minAvailable` — operators who prefer `maxUnavailable`
can override in their own values file.
*/}}

{{- /*
  Validate each PDB: minAvailable must be in [0, replicas]. A value
  greater than replicas would produce a PDB that is always violated and
  blocks every voluntary disruption (kubectl drain, cluster-autoscaler)
  (roadmap 0b.5 review #10).
*/ -}}

{{- if .Values.coordinator.podDisruptionBudget.enabled }}
{{- if gt (int .Values.coordinator.podDisruptionBudget.minAvailable) (int .Values.coordinator.replicas) }}
{{- fail (printf "coordinator.podDisruptionBudget.minAvailable (%d) > coordinator.replicas (%d)" (int .Values.coordinator.podDisruptionBudget.minAvailable) (int .Values.coordinator.replicas)) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gvdb.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.coordinator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.coordinator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gvdb.coordinator.selectorLabels" . | nindent 6 }}
{{- end }}

{{- if .Values.dataNode.podDisruptionBudget.enabled }}
{{- if gt (int .Values.dataNode.podDisruptionBudget.minAvailable) (int .Values.dataNode.replicas) }}
{{- fail (printf "dataNode.podDisruptionBudget.minAvailable (%d) > dataNode.replicas (%d)" (int .Values.dataNode.podDisruptionBudget.minAvailable) (int .Values.dataNode.replicas)) }}
{{- end }}
