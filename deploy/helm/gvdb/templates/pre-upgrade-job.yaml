{{- if .Values.preUpgradeHook.enabled }}
{{- $name := printf "%s-pre-upgrade" (include "gvdb.fullname" .) -}}
{{- $hookAnnotations := dict
    "helm.sh/hook" "pre-upgrade"
    "helm.sh/hook-weight" "-10"
    "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
-}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" $name (int .Release.Revision) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "gvdb.labels" . | nindent 8 }}
        app: {{ $name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      containers:
        - name: rollout-check
          image: {{ .Values.preUpgradeHook.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NS="{{ .Release.Namespace }}"
              REL="{{ include "gvdb.fullname" . }}"
              TIMEOUT="{{ .Values.preUpgradeHook.timeoutSeconds | default 60 }}s"
              for r in sts/${REL}-coordinator sts/${REL}-data-node sts/${REL}-query-node deployment/${REL}-proxy; do
                echo "Checking $r"
                kubectl -n "$NS" rollout status "$r" --timeout="$TIMEOUT"
              done
              echo "All GVDB workloads healthy; proceeding with upgrade."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
