{{/*
Per-workload ServiceAccount templates.

One SA per workload so cloud-IAM annotations (IRSA for EKS, Workload
Identity for GKE, Azure WI for AKS) can be scoped per workload — only
data-nodes need object-store access, proxy doesn't. Default off; when
enabled, the corresponding Pod spec binds its serviceAccountName. Names
default to `<release>-<workload>` but can be overridden via
`<workload>.serviceAccount.name`.
*/}}

{{- if .Values.coordinator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-coordinator" (include "gvdb.fullname" .)) .Values.coordinator.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.coordinator.labels" . | nindent 4 }}
  {{- with .Values.coordinator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

