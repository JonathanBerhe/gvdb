apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gvdb.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.coordinator.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gvdb.coordinator.serviceName" . }}
  replicas: {{ .Values.coordinator.replicas }}
  # Start all coordinator pods in parallel. The default OrderedReady
  # deadlocks HA bootstrap: pod-0 can't reach Ready until Raft quorum
  # forms, Raft quorum needs pod-1/pod-2, and OrderedReady won't start
  # pod-1 until pod-0 is Ready. Parallel breaks the cycle. Safe for
  # statelessly-identified pods because each pod derives its identity
  # from HOSTNAME independently.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "gvdb.coordinator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gvdb.coordinator.labels" . | nindent 8 }}
      {{- with .Values.coordinator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.coordinator.serviceAccount.create .Values.coordinator.serviceAccount.name }}
      serviceAccountName: {{ include "gvdb.coordinator.serviceAccountName" . }}
      {{- end }}
      {{- with (include "gvdb.coordinator.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.coordinator.podAntiAffinity.enabled }}
      affinity:
        {{- include "gvdb.antiAffinity" (dict
             "selectorLabels" (include "gvdb.coordinator.selectorLabels" .)
             "type" .Values.coordinator.podAntiAffinity.type
             "topologyKey" .Values.coordinator.podAntiAffinity.topologyKey) | nindent 8 }}
      {{- end }}
      {{- if or .Values.coordinator.zoneSpread.enabled .Values.coordinator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- if .Values.coordinator.zoneSpread.enabled }}
        {{- include "gvdb.zoneSpread" (dict
             "selectorLabels" (include "gvdb.coordinator.selectorLabels" .)
             "whenUnsatisfiable" "DoNotSchedule"
             "maxSkew" .Values.coordinator.zoneSpread.maxSkew) | nindent 8 }}
        {{- end }}
        {{- with .Values.coordinator.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.coordinator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ include "gvdb.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.security.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "-c"]
          args:
            - |
              # Derive a 1-indexed node-id from the StatefulSet ordinal so
              # each coordinator pod gets a stable identity across restarts.
              # NuRaft requires node_id > 0. Validate the parsed ordinal
              # explicitly so a future StatefulSet rename that breaks the
              # '<name>-<ordinal>' pattern fails loud instead of silently
              # producing node-id=1 for every pod.
              # Use POSIX-portable constructs (runtime shell is /bin/sh =
              # dash) — no bash-isms like [[ ]] or `set -o pipefail`.
              set -eu
              ORDINAL=${HOSTNAME##*-}
              case "$ORDINAL" in
                ''|*[!0-9]*)
                  echo "ERROR: could not parse ordinal from HOSTNAME=$HOSTNAME" >&2
                  exit 1
                  ;;
              esac
              NODE_ID=$((ORDINAL + 1))
              CLUSTER_DOMAIN="{{ include "gvdb.clusterDomain" . }}"
              ADVERTISE="${HOSTNAME}.{{ include "gvdb.coordinator.serviceName" . }}.{{ .Release.Namespace }}.svc.${CLUSTER_DOMAIN}:50051"
              RAFT_ADVERTISE="${HOSTNAME}.{{ include "gvdb.coordinator.serviceName" . }}.{{ .Release.Namespace }}.svc.${CLUSTER_DOMAIN}:8300"
              exec /usr/local/bin/gvdb-coordinator \
                --node-id $NODE_ID \
                --bind-address 0.0.0.0:50051 \
                --advertise-address $ADVERTISE \
                --raft-address 0.0.0.0:8300 \
                --raft-advertise-address $RAFT_ADVERTISE \
                --data-dir /data/gvdb/coordinator \
                {{- if or .Values.tls.enabled .Values.objectStore.enabled }}
                --config /etc/gvdb/config.yaml \
                {{- end }}
                {{- if le (int .Values.coordinator.replicas) 1 }}
                --single-node
                {{- else }}
                --raft-peers {{ include "gvdb.coordinator.raftPeers" . | quote }}
                {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8300
              name: raft
            - containerPort: 9091
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /data/gvdb/coordinator
            - name: config
              mountPath: /etc/gvdb
            {{- if .Values.tls.enabled }}
            {{- include "gvdb.tls.volumeMount" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            # The coordinator waits up to 60s for Raft leader election
            # during HA bootstrap before opening :50051. Give the probe
            # enough runway to not kill the pod mid-election when peers
            # come up in parallel.
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gvdb.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        {{- include "gvdb.tls.volume" . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.coordinator.storage.storageClass }}
        storageClassName: {{ .Values.coordinator.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.coordinator.storage.size }}
