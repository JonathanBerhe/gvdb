apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gvdb.fullname" . }}-query-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvdb.queryNode.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gvdb.queryNode.serviceName" . }}
  replicas: {{ .Values.queryNode.replicas }}
  selector:
    matchLabels:
      {{- include "gvdb.queryNode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gvdb.queryNode.labels" . | nindent 8 }}
      {{- with .Values.queryNode.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.queryNode.serviceAccount.create .Values.queryNode.serviceAccount.name }}
      serviceAccountName: {{ include "gvdb.queryNode.serviceAccountName" . }}
      {{- end }}
      {{- with (include "gvdb.queryNode.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.queryNode.podAntiAffinity.enabled }}
      affinity:
        {{- include "gvdb.antiAffinity" (dict
             "selectorLabels" (include "gvdb.queryNode.selectorLabels" .)
             "type" .Values.queryNode.podAntiAffinity.type
             "topologyKey" .Values.queryNode.podAntiAffinity.topologyKey) | nindent 8 }}
      {{- end }}
      {{- if or .Values.queryNode.zoneSpread.enabled .Values.queryNode.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- if .Values.queryNode.zoneSpread.enabled }}
        {{- include "gvdb.zoneSpread" (dict
             "selectorLabels" (include "gvdb.queryNode.selectorLabels" .)
             "whenUnsatisfiable" "DoNotSchedule"
             "maxSkew" .Values.queryNode.zoneSpread.maxSkew) | nindent 8 }}
        {{- end }}
        {{- with .Values.queryNode.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.queryNode.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queryNode.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Give the pod time to send a drain heartbeat to the coordinator and
      # finish in-flight work before K8s sends SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.queryNode.terminationGracePeriodSeconds | default 30 }}
      initContainers:
        - name: wait-for-coordinator
          image: "{{ include "gvdb.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for coordinator..."
              until nc -z {{ include "gvdb.coordinator.address" . | replace ":50051" "" }} 50051; do
                sleep 2
              done
              echo "Coordinator is ready"
      containers:
        - name: query-node
          image: "{{ include "gvdb.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.security.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "-c"]
          args:
            - |
              ORDINAL=${HOSTNAME##*-}
              NODE_ID=$((201 + ORDINAL))
              ADVERTISE="${HOSTNAME}.{{ include "gvdb.queryNode.serviceName" . }}.{{ .Release.Namespace }}.svc.cluster.local:50070"
              exec /usr/local/bin/gvdb-query-node \
                --node-id $NODE_ID \
                --bind-address 0.0.0.0:50070 \
                --advertise-address $ADVERTISE \
                --data-dir /data/gvdb/query_node \
                --coordinator {{ include "gvdb.coordinator.address" . }} \
                {{- if .Values.tls.enabled }}
                --config /etc/gvdb/config.yaml \
                {{- end }}
                --memory-limit-gb {{ .Values.queryNode.memoryLimitGb }}
          ports:
            - containerPort: 50070
              name: grpc
            # The bound metrics port is 9201 + ordinal (per-pod, dynamic). K8s
            # does not enforce that containerPort matches the listening port —
            # this declaration exists so the PodMonitor can target the named
            # "metrics" port for discovery; the relabel rules in
            # servicemonitor.yaml rewrite __address__ to the actual ordinal-
            # specific port.
            - containerPort: 9201
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /data/gvdb/query_node
            - name: config
              mountPath: /etc/gvdb
            {{- if .Values.tls.enabled }}
            {{- include "gvdb.tls.volumeMount" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 50070
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50070
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.queryNode.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gvdb.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        {{- include "gvdb.tls.volume" . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.queryNode.storage.storageClass }}
        storageClassName: {{ .Values.queryNode.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.queryNode.storage.size }}
