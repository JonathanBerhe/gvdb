                    - desired
                    - ready
                    type: object
                  queryNode:
                    description: WorkloadStatus reports desired vs ready replicas
                      for one workload.
                    properties:
                      desired:
                        description: desired is the spec replica count.
                        format: int32
                        type: integer
                      ready:
                        description: ready is the count of Ready pods (from StatefulSet
                          / Deployment status).
                        format: int32
                        type: integer
                    required:
                    - desired
                    - ready
                    type: object
                type: object
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the operator most
                  recently reconciled against. Callers use this with conditions to know
                  whether status is fresh.
