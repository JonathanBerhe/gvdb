syntax = "proto3";

package gvdb.proto;

option go_package = "gvdb/integration-tests/pb";

option java_package = "io.gvdb.proto";
option java_multiple_files = true;
option java_outer_classname = "VectorDbProto";

// ============================================================================
// Core Data Types
// ============================================================================

message Vector {
  repeated float values = 1;
  uint32 dimension = 2;
}

// Sparse vector for learned sparse retrieval (SPLADE, etc.)
message SparseVector {
  repeated uint32 indices = 1;  // Non-zero dimension indices (sorted ascending)
  repeated float values = 2;    // Corresponding non-zero values
}

// Metadata value (supports multiple types)
message MetadataValue {
  oneof value {
    int64 int_value = 1;
    double double_value = 2;
    string string_value = 3;
    bool bool_value = 4;
  }
}

// Metadata (key-value pairs)
message Metadata {
  map<string, MetadataValue> fields = 1;
}

message VectorWithId {
  uint64 id = 1;
  Vector vector = 2;
  Metadata metadata = 3;  // Optional metadata
  SparseVector sparse_vector = 4;  // Optional sparse vector for hybrid retrieval
  uint32 ttl_seconds = 5;  // Optional TTL in seconds (0 = no expiration)
}

message SearchResultEntry {
  uint64 id = 1;
  float distance = 2;
  Metadata metadata = 3;  // Optional: return metadata with results
}

// ============================================================================
// Collection Management
// ============================================================================

message CreateCollectionRequest {
  string collection_name = 1;
  uint32 dimension = 2;

  enum MetricType {
    L2 = 0;
    INNER_PRODUCT = 1;
    COSINE = 2;
  }
  MetricType metric = 3;

  enum IndexType {
    FLAT = 0;
    HNSW = 1;
    IVF_FLAT = 2;
    IVF_PQ = 3;    // Inverted File with Product Quantization
    IVF_SQ = 4;    // Inverted File with Scalar Quantization
    IVF_TURBOQUANT = 5;  // IVF + TurboQuant compression (sub-linear + extreme compression)
    TURBOQUANT = 6;      // TurboQuant online quantization (data-oblivious)
    AUTO = 7;            // Automatically select based on vector count at seal time
  }
  IndexType index_type = 4;

  uint32 num_shards = 5;  // Number of shards (0 = default 1)
}

message CreateCollectionResponse {
  uint32 collection_id = 1;
  string message = 2;
}

message DropCollectionRequest {
  string collection_name = 1;
}

message DropCollectionResponse {
  string message = 1;
}

message ListCollectionsRequest {}

message CollectionInfo {
  uint32 collection_id = 1;
  string collection_name = 2;
  uint32 dimension = 3;
  string metric_type = 4;
  uint64 vector_count = 5;
}

message ListCollectionsResponse {
  repeated CollectionInfo collections = 1;
}

// ============================================================================
// Vector Operations
// ============================================================================

message InsertRequest {
  string collection_name = 1;
  repeated VectorWithId vectors = 2;
}

message InsertResponse {
  uint64 inserted_count = 1;
  string message = 2;
}

message SearchRequest {
  string collection_name = 1;
  Vector query_vector = 2;
  uint32 top_k = 3;
  string filter = 4;  // Optional: SQL-like filter expression (e.g., "price < 100 AND brand = 'Nike'")
  bool return_metadata = 5;  // Optional: whether to return metadata in results
}

message SearchResponse {
  repeated SearchResultEntry results = 1;
  float query_time_ms = 2;
}

message GetRequest {
  string collection_name = 1;
  repeated uint64 ids = 2;  // Vector IDs to retrieve
  bool return_metadata = 3;  // Optional: whether to return metadata
}

message GetResponse {
  repeated VectorWithId vectors = 1;  // Retrieved vectors (may be fewer than requested if some IDs not found)
  repeated uint64 not_found_ids = 2;  // IDs that were not found
}

message DeleteRequest {
  string collection_name = 1;
  repeated uint64 ids = 2;  // Vector IDs to delete
}

message DeleteResponse {
  uint64 deleted_count = 1;  // Number of vectors actually deleted
  repeated uint64 not_found_ids = 2;  // IDs that were not found
  string message = 3;
}

message UpdateMetadataRequest {
  string collection_name = 1;
  uint64 id = 2;  // Vector ID to update
  Metadata metadata = 3;  // New metadata (replaces existing)
  bool merge = 4;  // If true, merge with existing metadata. If false, replace completely.
}

message UpdateMetadataResponse {
  bool updated = 1;  // Whether the update succeeded
  string message = 2;
}

// ============================================================================
// Vector Browsing (for Web UI)
// ============================================================================

message ListVectorsRequest {
  string collection_name = 1;
  uint32 limit = 2;           // Page size (default 20)
  uint64 offset = 3;          // Offset for pagination
  bool include_metadata = 4;
}

message ListVectorsResponse {
  repeated VectorWithId vectors = 1;
  uint64 total_count = 2;
  bool has_more = 3;
}

// ============================================================================
// Health and Status
// ============================================================================

message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  Status status = 1;
  string message = 2;
}

message GetStatsRequest {}

message GetStatsResponse {
  uint64 total_vectors = 1;
  uint64 total_collections = 2;
  uint64 total_queries = 3;
  float avg_query_time_ms = 4;
}

// ============================================================================
// Upsert (Insert or Update)
// ============================================================================

message UpsertRequest {
  string collection_name = 1;
  repeated VectorWithId vectors = 2;
}

message UpsertResponse {
  uint64 upserted_count = 1;
  uint64 inserted_count = 2;   // New vectors inserted
  uint64 updated_count = 3;    // Existing vectors replaced
  string message = 4;
}

// ============================================================================
// Range Search (Find all vectors within a distance)
// ============================================================================

message RangeSearchRequest {
  string collection_name = 1;
  Vector query_vector = 2;
  float radius = 3;             // Distance threshold
  string filter = 4;            // Optional metadata filter
  bool return_metadata = 5;
  uint32 max_results = 6;       // Limit results (0 = unlimited, default 1000)
}

message RangeSearchResponse {
  repeated SearchResultEntry results = 1;
  float query_time_ms = 2;
}

// ============================================================================
// Hybrid Search (BM25 + Vector)
// ============================================================================

message HybridSearchRequest {
  string collection_name = 1;
  Vector query_vector = 2;     // Dense vector query
  string text_query = 3;       // Text query for BM25
  uint32 top_k = 4;
  string filter = 5;           // Optional metadata filter
  bool return_metadata = 6;
  float vector_weight = 7;     // 0.0-1.0 (default: 0.5 if both set)
  float text_weight = 8;       // 0.0-1.0 (default: 0.5 if both set)
  string text_field = 9;       // Metadata field for BM25 (default: "text")
  SparseVector sparse_query = 10;  // Optional sparse query vector
  float sparse_weight = 11;        // Weight for sparse results in RRF (0 = disabled)
}

message HybridSearchResponse {
  repeated SearchResultEntry results = 1;
  float query_time_ms = 2;
}

// ============================================================================
// Server-Side Bulk Import
// ============================================================================

enum ImportFormat {
  PARQUET = 0;
  NUMPY = 1;
}

enum ImportState {
  IMPORT_PENDING = 0;
  IMPORT_RUNNING = 1;
  IMPORT_COMPLETED = 2;
  IMPORT_FAILED = 3;
  IMPORT_CANCELLED = 4;
}

message BulkImportRequest {
  string collection_name = 1;
  string source_uri = 2;       // s3://bucket/path/file.parquet or s3://bucket/path/vectors.npy
  ImportFormat format = 3;
  string vector_column = 4;    // Parquet only. Default: "vector"
  string id_column = 5;        // Parquet only. Default: "id"
}

message BulkImportResponse {
  string import_id = 1;
  string message = 2;
}

message GetImportStatusRequest {
  string import_id = 1;
}

message GetImportStatusResponse {
  string import_id = 1;
  ImportState state = 2;
  uint64 total_vectors = 3;
  uint64 imported_vectors = 4;
  float progress_percent = 5;
  string error_message = 6;
  float elapsed_seconds = 7;
  uint32 segments_created = 8;
}

message CancelImportRequest {
  string import_id = 1;
}

message CancelImportResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// Backup and Restore
// ============================================================================

// BackupTarget selects where backup artifacts are written. Mirrors the
// IObjectStore choice in the C++ runtime — S3 uses S3ObjectStore,
// LocalPath uses FilesystemObjectStore.
message BackupTarget {
  oneof target {
    S3Target s3 = 1;
    LocalTarget local = 2;
  }
}

message S3Target {
  // Bucket the data-node uploads to. Credentials come from the data-node's
  // configured object-store credentials (typically IRSA / Workload Identity).
  string bucket = 1;
  // Optional prefix under the bucket. Final key layout is
  //   <prefix>/backups/<backup_id>/...
  string prefix = 2;
}

message LocalTarget {
  // Absolute path on the data-node. Must be under a server-side allow-list
  // (see BackupConfig.local_backup_dir).
  string path = 1;
}

enum BackupState {
  BACKUP_PENDING = 0;
  BACKUP_RUNNING = 1;
  BACKUP_COMPLETED = 2;
  BACKUP_FAILED = 3;
  BACKUP_CANCELLED = 4;
}

message BackupCollectionRequest {
  string collection_name = 1;
  BackupTarget target = 2;
  // Optional: parent backup_id for an incremental backup. The current
  // implementation always takes a full backup and ignores this field;
  // the seam is preserved for a later incremental implementation.
  string incremental_from = 3;
  // Optional: client-supplied backup_id for idempotency. Empty = server
  // allocates one of the form "bk-<RFC3339>-<rand>".
  string backup_id = 4;
}

message BackupCollectionResponse {
  string backup_id = 1;
  string message = 2;
}

message RestoreCollectionRequest {
  BackupTarget source = 1;
  string backup_id = 2;
  // Where to restore into. Empty = use the collection name from the
  // backup manifest. Fails if the target already exists unless
  // overwrite=true.
  string target_collection_name = 3;
  // If true and the target collection exists, drop it then recreate
  // from the backup. If false and it exists, the call fails.
  bool overwrite = 4;
}

message RestoreCollectionResponse {
  string restore_id = 1;
  string message = 2;
}

message GetBackupStatusRequest {
  string backup_id = 1;
}

message GetBackupStatusResponse {
  string backup_id = 1;
  BackupState state = 2;
  uint32 shards_total = 3;
  uint32 shards_completed = 4;
  uint64 bytes_uploaded = 5;
  string error_message = 6;
  float elapsed_seconds = 7;
  // Canonical URI of the top-level backup manifest, e.g.
  //   "s3://bucket/prefix/backups/<id>/backup.manifest.json"
  // Empty until the backup reaches BACKUP_COMPLETED.
  string manifest_uri = 8;
}

message GetRestoreStatusRequest {
  string restore_id = 1;
}

message GetRestoreStatusResponse {
  string restore_id = 1;
  // Reuses BackupState; CANCELLED is unused for restore.
  BackupState state = 2;
  uint32 shards_total = 3;
  uint32 shards_completed = 4;
  string error_message = 5;
  float elapsed_seconds = 6;
}

message ListBackupsRequest {
  BackupTarget source = 1;
}

message BackupInfo {
  string backup_id = 1;
  string collection_name = 2;
  uint32 collection_id = 3;
  int64 created_at_unix_ms = 4;
  uint64 vector_count = 5;
  uint64 size_bytes = 6;
  uint32 manifest_version = 7;
}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
}

message CancelBackupRequest {
  string backup_id = 1;
}

message CancelBackupResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// VectorDB Service
// ============================================================================

service VectorDBService {
  // Collection management
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // Vector operations
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc StreamInsert(stream InsertRequest) returns (InsertResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc RangeSearch(RangeSearchRequest) returns (RangeSearchResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);
  rpc ListVectors(ListVectorsRequest) returns (ListVectorsResponse);

  // Hybrid search (BM25 + vector)
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);

  // Server-side bulk import
  rpc BulkImport(BulkImportRequest) returns (BulkImportResponse);
  rpc GetImportStatus(GetImportStatusRequest) returns (GetImportStatusResponse);
  rpc CancelImport(CancelImportRequest) returns (CancelImportResponse);

  // Backup and restore
  rpc BackupCollection(BackupCollectionRequest) returns (BackupCollectionResponse);
  rpc RestoreCollection(RestoreCollectionRequest) returns (RestoreCollectionResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
  rpc GetRestoreStatus(GetRestoreStatusRequest) returns (GetRestoreStatusResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc CancelBackup(CancelBackupRequest) returns (CancelBackupResponse);

  // Health and stats
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}