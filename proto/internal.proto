syntax = "proto3";

package gvdb.proto.internal;

option go_package = "gvdb/internal/pb";

import "vectordb.proto";

// ============================================================================
// Node Information and Health
// ============================================================================

enum NodeType {
  NODE_TYPE_UNKNOWN = 0;
  NODE_TYPE_COORDINATOR = 1;
  NODE_TYPE_DATA_NODE = 2;
  NODE_TYPE_QUERY_NODE = 3;
  NODE_TYPE_PROXY = 4;
}

enum NodeStatus {
  // Default / unset — node has not yet reported a status.
  NODE_STATUS_UNKNOWN = 0;
  // Node is initializing and not yet ready to serve traffic.
  NODE_STATUS_STARTING = 1;
  // Node is healthy and accepting requests.
  NODE_STATUS_READY = 2;
  // Node is operational but under high load.
  NODE_STATUS_BUSY = 3;
  // Node is operational with reduced capacity (partial failure).
  NODE_STATUS_DEGRADED = 4;
  // Node is unreachable or has failed.
  NODE_STATUS_DOWN = 5;
  // Node is shutting down gracefully. Sent as a final heartbeat from the node
  // so the coordinator stops routing new work to it without waiting for
  // heartbeat timeout (roadmap 0b.1).
  NODE_STATUS_DRAINING = 6;
}

message NodeInfo {
  uint32 node_id = 1;
  NodeType node_type = 2;
  string grpc_address = 3;
  string raft_address = 4;  // Only for coordinators
  NodeStatus status = 5;

  // Resource information
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  uint64 disk_used_bytes = 8;
  uint64 disk_total_bytes = 9;

  // Performance metrics
  uint64 total_requests = 10;
  float avg_latency_ms = 11;
  uint32 error_count = 12;
}

// ============================================================================
// Shard Management
// ============================================================================

message ShardAssignment {
  uint32 shard_id = 1;
  repeated uint32 node_ids = 2;  // Replica nodes for this shard
  uint32 primary_node_id = 3;     // Primary node for writes
}

message AssignShardRequest {
  uint32 shard_id = 1;
  uint32 node_id = 2;
  bool is_primary = 3;
}

message AssignShardResponse {
  bool success = 1;
  string message = 2;
}

message GetShardAssignmentsRequest {
  uint32 collection_id = 1;  // 0 means all collections
}

message GetShardAssignmentsResponse {
  repeated ShardAssignment assignments = 1;
}

message RebalanceShardsRequest {
  uint32 collection_id = 1;  // 0 means all collections
}

message RebalanceShardsResponse {
  uint32 shards_moved = 1;
  string message = 2;
}

// ============================================================================
// Segment Replication
// ============================================================================

message SegmentInfo {
  uint64 segment_id = 1;
  uint32 collection_id = 2;
  uint32 shard_id = 3;
  uint64 vector_count = 4;
  uint64 size_bytes = 5;
  bool is_sealed = 6;
  int64 created_at = 7;  // Unix timestamp
  int64 sealed_at = 8;   // Unix timestamp
}

message ReplicateSegmentRequest {
  SegmentInfo segment_info = 1;
  uint32 target_node_id = 2;
  bytes segment_data = 3;  // Serialized segment data
}

message ReplicateSegmentResponse {
  bool success = 1;
  string message = 2;
}

message GetSegmentRequest {
  uint64 segment_id = 1;
}

message GetSegmentResponse {
  SegmentInfo segment_info = 1;
  bytes segment_data = 2;
}

message ListSegmentsRequest {
  uint32 collection_id = 1;  // 0 means all collections
  uint32 shard_id = 2;       // 0 means all shards
}

message ListSegmentsResponse {
  repeated SegmentInfo segments = 1;
}

message DeleteSegmentRequest {
  uint64 segment_id = 1;
  bool force = 2;  // Delete even if replicas exist
}

message DeleteSegmentResponse {
  bool success = 1;
  string message = 2;
}

message CreateSegmentRequest {
  uint64 segment_id = 1;
  uint32 collection_id = 2;
  uint32 dimension = 3;
  string metric_type = 4;  // "L2", "INNER_PRODUCT", "COSINE"
  string index_type = 5;   // "FLAT", "HNSW", "IVF_FLAT", "IVF_PQ", "IVF_SQ"
}

message CreateSegmentResponse {
  bool success = 1;
  string message = 2;
  uint64 segment_id = 3;  // Echo back for confirmation
}

// ============================================================================
// Metadata Synchronization
// ============================================================================

message CollectionMetadata {
  uint32 collection_id = 1;
  string collection_name = 2;
  uint32 dimension = 3;
  string metric_type = 4;
  string index_type = 5;
  uint64 vector_count = 6;
  int64 created_at = 7;  // Unix timestamp
  uint32 shard_count = 8;
  repeated ShardAssignment shard_assignments = 9;
}

message SyncMetadataRequest {
  uint32 node_id = 1;
  int64 last_sync_timestamp = 2;  // Request changes after this timestamp
}

message SyncMetadataResponse {
  repeated CollectionMetadata collections = 1;
  repeated ShardAssignment shard_assignments = 2;
  int64 current_timestamp = 3;
}

message GetCollectionMetadataRequest {
  oneof identifier {
    uint32 collection_id = 1;
    string collection_name = 2;
  }
}

message GetCollectionMetadataResponse {
  CollectionMetadata metadata = 1;
  bool found = 2;
}

// ============================================================================
// Query Routing and Execution
// ============================================================================

message RouteQueryRequest {
  string collection_name = 1;
  repeated float query_vector = 2;
  uint32 top_k = 3;
  string filter = 4;
  bool return_metadata = 5;
  // When true, the coordinator may return a non-primary replica as the
  // target for a shard if the primary is draining. Proxies set this for
  // read operations where stale-but-live replicas are acceptable. Writes
  // must always go to the primary and should leave this false (roadmap
  // 0b.1 — proper primary migration is 0b.3).
  bool prefer_routable_replica = 6;
}

// One candidate target for a shard. Carries enough info for the caller to
// dial the node and decide whether it has fallen back from the primary.
message RouteQueryNodeOption {
  uint32 node_id = 1;
  string node_address = 2;
  // True iff this option is the shard's primary in the current
  // assignment. Distinguishes "first-attempt was primary" from
  // "first-attempt was already a replica because primary was draining".
  bool is_primary = 3;
  // Monotonic per-shard primary term at routing time. Stamped onto
  // every write RPC by the proxy as the `gvdb-shard-term` gRPC
  // metadata header; the data-node rejects writes whose term doesn't
  // match its locally-recorded term so a write routed just before a
  // primary swap can't commit on the demoted node. Reads ignore this
  // (any term-tagged read is fine; staleness is bounded by the
  // replica-lag invariant which is a separate concern).
  uint64 primary_term = 4;
}

// Per-shard prioritized list of candidate target nodes. The first entry
// matches the legacy target_node_id / target_node_address parallel arrays
// in RouteQueryResponse; subsequent entries are routable replicas the
// caller can fall back to on UNAVAILABLE / DEADLINE_EXCEEDED before
// surfacing an error to the user.
message RouteQueryShardOptions {
  uint32 shard_id = 1;
  repeated RouteQueryNodeOption options = 2;
}

message RouteQueryResponse {
  repeated uint32 target_shard_ids = 1;
  repeated uint32 target_node_ids = 2;
  repeated string target_node_addresses = 3;
  uint32 collection_id = 4;
  // Per-shard fallback list, parallel to target_shard_ids by shard_id.
  // options[0] mirrors the entry in target_node_ids/target_node_addresses;
  // options[1..N] are routable replicas to try after a transient failure.
  // Optional for back-compat: pre-1.x clients ignore this field and keep
  // working with the single-target parallel arrays.
  repeated RouteQueryShardOptions per_shard_options = 5;
}

message ExecuteShardQueryRequest {
  uint32 collection_id = 1;
  uint32 shard_id = 2;
  repeated float query_vector = 3;
  uint32 top_k = 4;
  string filter = 5;
  bool return_metadata = 6;
}

message SearchResult {
  uint64 id = 1;
  float distance = 2;
  gvdb.proto.Metadata metadata = 3;
}

message ExecuteShardQueryResponse {
  repeated SearchResult results = 1;
  float query_time_ms = 2;
  uint32 vectors_scanned = 3;
}

// ============================================================================
// Data Transfer (for rebalancing and recovery)
// ============================================================================

message TransferDataRequest {
  uint32 collection_id = 1;
  uint32 shard_id = 2;
  uint32 source_node_id = 3;
  uint32 target_node_id = 4;
}

message TransferDataResponse {
  bool success = 1;
  uint64 vectors_transferred = 2;
  string message = 3;
}

// ============================================================================
// Heartbeat and Health Monitoring
// ============================================================================

message HeartbeatRequest {
  NodeInfo node_info = 1;
}

// Per-shard primary view pushed to a data-node so it can gate writes
// against "am I currently primary for this shard at this term?".
message ShardPrimaryAssignment {
  uint32 shard_id = 1;
  uint32 primary_node_id = 2;
  uint64 term = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  int64 timestamp = 2;

  // Coordinator can send instructions in heartbeat response
  repeated uint32 assigned_shards = 3;
  bool should_rebalance = 4;

  // Authoritative per-shard primary view for shards this responding
  // node touches (either as primary or as replica). Steady-state
  // sync channel for the data-node's PrimaryTermTracker. Backward-
  // compatible: pre-1.x data-nodes ignore this field.
  repeated ShardPrimaryAssignment shard_primaries = 5;
}

message GetClusterHealthRequest {}

message GetClusterHealthResponse {
  repeated NodeInfo nodes = 1;
  uint32 total_shards = 2;
  uint32 healthy_shards = 3;
  uint32 degraded_shards = 4;
  string cluster_status = 5;  // "healthy", "degraded", "critical"

  // Unix-ms timestamp of the most recently completed auto-rebalance. Zero
  // when no rebalance has happened on this coordinator's watch (roadmap
  // 0b.6.E). Sourced from Coordinator::GetLastAutoRebalance().
  int64 last_rebalance_unix_ms = 6;
}

// ============================================================================
// Leader info (All Nodes → Coordinator; operator → Coordinator)
// ============================================================================
//
// Populates GVDBCluster.status.coordinatorLeader and gates the operator's
// Raft-quorum-aware rolling-upgrade state machine (roadmap 0b.6.D + 0b.6.C).
// Any coordinator pod can answer this — they all track the current leader
// via Raft — so the operator can fall through to a live pod if the one it
// asks first is being rolled.

message GetLeaderInfoRequest {}

message GetLeaderInfoResponse {
  // Raft node id of the current leader. -1 or 0 when unknown / no leader.
  int32 leader_id = 1;

  // Best-effort resolved "pod-name" (or endpoint) for the leader. Empty when
  // the coordinator cannot resolve the id to a known address (e.g. during
  // startup before NodeRegistry has seen the leader pod).
  string leader_address = 2;

  // Current Raft term seen by the responding coordinator.
  uint64 current_term = 3;

  // True when the responding coordinator is itself the leader.
  bool is_leader_self = 4;
}

// ============================================================================
// Timestamp Oracle (for distributed transactions)
// ============================================================================

message GetTimestampRequest {
  uint32 count = 1;  // How many timestamps to allocate
}

message GetTimestampResponse {
  uint64 start_timestamp = 1;
  uint64 end_timestamp = 2;  // Inclusive range [start, end]
}

// ============================================================================
// Raft Membership (Coordinator → Coordinator; roadmap 1.7b)
// ============================================================================
//
// Runtime Raft membership changes for coordinator scale-up and scale-down.
// Before 1.7b, scaling coordinators via `kubectl scale` caused split-brain:
// fresh pods loaded persisted_cluster_size==0, seeded their own cluster_config
// from the declared --raft-peers list, and elected themselves as a parallel
// Raft quorum. These RPCs let new pods probe existing peers for a live leader
// and call JoinCluster to be added via NuRaft's add_srv, and let departing
// pods self-remove via RemovePeer on graceful shutdown.
//
// Both RPCs are LEADER-ONLY. A non-leader response populates
// current_leader_id so the caller can retry against the leader.

message JoinClusterRequest {
  // Joining pod's Raft node id (derived from StatefulSet ordinal in the
  // coordinator startup script: NODE_ID = ORDINAL + 1).
  uint32 node_id = 1;

  // Joining pod's Raft advertise address, e.g.
  // "release-coordinator-3.release-coordinator.gvdb.svc.cluster.local:8300".
  string raft_advertise_address = 2;
}

message JoinClusterResponse {
  bool success = 1;
  string message = 2;
  // Populated when success==false because the recipient wasn't the leader.
  // Caller uses this to retry on the correct pod. Zero if no leader known.
  int32 current_leader_id = 3;
}

message RemovePeerRequest {
  // Peer to drop from Raft membership. Typically the caller's own node_id
  // when self-removing during graceful shutdown.
  uint32 node_id = 1;
}

message RemovePeerResponse {
  bool success = 1;
  string message = 2;
  int32 current_leader_id = 3;
}

// ============================================================================
// Raft Scale Reconciliation (Operator → Coordinator; roadmap 1.8)
// ============================================================================
//
// 1.7b wires JoinCluster + RemovePeer so the coordinator binary self-joins
// on startup and self-removes on graceful SIGTERM. When K8s SIGKILLs a pod
// (OOM, terminationGracePeriod exceeded, manual `kubectl delete --force`),
// the self-remove never runs and the leader's cluster_config carries a
// ghost peer. These two RPCs let the operator's reconcile loop observe
// current Raft membership and orchestrate safe scale-down cleanup:
//   - GetRaftMembership: any coordinator pod reports the current config.
//   - TransferLeadership: move leader role off a pod before RemovePeer,
//     avoiding NuRaft's CANNOT_REMOVE_LEADER rejection.

message GetRaftMembershipRequest {}

message RaftMember {
  uint32 node_id = 1;
  // Peer-facing Raft advertise address from NuRaft srv_config.
  string raft_endpoint = 2;
  // True during mid-join catch-up; the operator treats learners as not-yet
  // voting members when picking a leadership successor.
  bool is_learner = 3;
}

message GetRaftMembershipResponse {
  repeated RaftMember members = 1;
  // Convenience: the responding coordinator's view of the current leader.
  // Saves the caller an extra GetLeaderInfo round-trip when both pieces
  // of state are needed together.
  int32 current_leader_id = 2;
}

message TransferLeadershipRequest {
  // Preferred successor. Must be a current cluster member; if not, NuRaft
  // yields to "any" follower (best effort) rather than failing.
  uint32 target_node_id = 1;
}

message TransferLeadershipResponse {
  // success=true only when the target_node_id is observed as the new
  // leader within the coordinator's transfer-wait budget (3s default).
  // Transient failures (no quorum during the transfer window) return
  // success=false with current_leader_id populated so the operator retries.
  bool success = 1;
  string message = 2;
  int32 current_leader_id = 3;
}

// ============================================================================
// Two-Phase Primary Swap (Coordinator → Data Node)
// ============================================================================
//
// Surgical RPCs the coordinator uses to migrate a shard's primary from
// node A to node B without losing the linearizability guarantees that
// the write-path primary-term gate provides.
//
// The orchestrator (Coordinator::TransferPrimary) runs:
//   1. PausePrimary(A, shard, new_term, B) — A stops accepting writes
//      for `shard`. Writes from a stale-routing proxy now bounce with
//      ABORTED and the proxy retries via fresh RouteQuery.
//   2. PreparePromote(B, shard, new_term) — B records itself as primary
//      at the bumped term so it accepts writes the moment the proxy
//      learns the new routing.
//   3. Commit in ShardManager — RouteQuery now returns B@new_term.
//
// Both RPCs are idempotent so the coordinator's reconcile loop can
// replay them after a transient failure without corrupting state.

message PausePrimaryRequest {
  // Shard whose primary is being transferred away from this node.
  uint32 shard_id = 1;
  // The term being promoted to. Equals (this node's current term + 1).
  // Carried so the data-node can record `last_known_term = new_term - 1`
  // and reject any subsequent stale-routing write with the right error
  // message.
  uint64 new_term = 2;
  // Diagnostic: the node taking over as primary. Logged on the responding
  // node so on-call has breadcrumbs without round-tripping the coordinator.
  uint32 new_primary_node_id = 3;
}

message PausePrimaryResponse {
  bool success = 1;
  string message = 2;
}

message PreparePromoteRequest {
  // Shard this node is being promoted to primary for.
  uint32 shard_id = 1;
  // Target term. Must be strictly greater than the responding node's
  // currently-recorded term for this shard; the data-node returns
  // success=false on regression so a buggy coordinator double-promote
  // surfaces as a hard error rather than silently overwriting state.
  uint64 new_term = 2;
}

message PreparePromoteResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// Backup orchestration (Coordinator → Data Node)
// ============================================================================
//
// Backups are coordinator-orchestrated and data-node-local: per shard,
// the coordinator picks the primary data-node and dispatches BackupShard.
// The data-node uploads its shard's segments through its already-wired
// IObjectStore and returns the per-shard manifest's object key plus a
// flat segment list. The coordinator stitches the top-level manifest
// only after every shard has succeeded — a partial backup is therefore
// invisible to a restore (the top-level manifest does not exist).
//
// Idempotency: BackupShard and RestoreShard are idempotent on the same
// (backup_id, shard_id) / (restore_id, shard_id) pair so coordinator
// retries on transient RPC failure are safe.

message BackupShardRequest {
  string backup_id = 1;
  uint32 collection_id = 2;
  uint32 shard_id = 3;
  gvdb.proto.BackupTarget target = 4;
  // For incremental backup: list of segment_ids already captured by the
  // parent backup. The current implementation leaves this empty (full
  // backup every time); see BackupCollectionRequest.incremental_from.
  repeated uint64 parent_segment_ids = 5;
}

message ShardBackupSegmentEntry {
  uint64 segment_id = 1;
  // True iff the segment was in GROWING state at backup time and the
  // data-node serialized it via Segment::SerializeToBytes under a
  // shared_lock rather than copying a flushed file.
  bool is_growing = 2;
  uint64 vector_count = 3;
  uint64 size_bytes = 4;
  // Object keys (or filesystem paths) of every file belonging to this
  // segment in the target. Restore downloads all of them.
  repeated string object_keys = 5;
}

message BackupShardResponse {
  bool success = 1;
  string message = 2;
  repeated ShardBackupSegmentEntry segments = 3;
  // Object key of the per-shard manifest written by this data-node.
  // The coordinator records it in the top-level backup manifest.
  string shard_manifest_key = 4;
  uint64 bytes_uploaded = 5;
}

message RestoreShardRequest {
  // Identifier of the backup to restore from. The data-node derives the
  // shard manifest key as
  //   <prefix>/backups/<backup_id>/shards/<shard_id>/shard.manifest.json.
  string backup_id = 1;
  uint32 target_collection_id = 2;
  uint32 shard_id = 3;
  gvdb.proto.BackupTarget source = 4;
}

message RestoreShardResponse {
  bool success = 1;
  string message = 2;
  uint32 segments_restored = 3;
}

// Per-shard write fence. Toggled by the coordinator around the
// BackupShard call so SEALED segment file mtimes and GROWING segment
// contents are stable for the duration of the upload. Writes that
// arrive during a freeze return RESOURCE_EXHAUSTED so clients retry.
//
// The freeze auto-expires after lease_ms even if UnfreezeWrites is
// never called — this caps the blast radius of a coordinator crash
// mid-backup. The coordinator extends the lease by re-calling
// FreezeWrites with the same fence_token if the upload exceeds it.
message FreezeWritesRequest {
  uint32 shard_id = 1;
  // Opaque token chosen by the coordinator. UnfreezeWrites must present
  // the same token, so a stale (e.g. retried) Unfreeze cannot drop a
  // newer freeze.
  string fence_token = 2;
  int64 lease_ms = 3;
}

message FreezeWritesResponse {
  bool success = 1;
  string message = 2;
}

message UnfreezeWritesRequest {
  uint32 shard_id = 1;
  string fence_token = 2;
}

message UnfreezeWritesResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// InternalService - Node-to-Node Communication
// ============================================================================

service InternalService {
  // Shard management (Coordinator → Data/Query Nodes)
  rpc AssignShard(AssignShardRequest) returns (AssignShardResponse);
  rpc GetShardAssignments(GetShardAssignmentsRequest) returns (GetShardAssignmentsResponse);
  rpc RebalanceShards(RebalanceShardsRequest) returns (RebalanceShardsResponse);

  // Segment replication (Data Node → Data Node)
  rpc ReplicateSegment(ReplicateSegmentRequest) returns (ReplicateSegmentResponse);
  rpc GetSegment(GetSegmentRequest) returns (GetSegmentResponse);
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse);
  rpc DeleteSegment(DeleteSegmentRequest) returns (DeleteSegmentResponse);

  // Segment creation (Coordinator → Data Node)
  rpc CreateSegment(CreateSegmentRequest) returns (CreateSegmentResponse);

  // Metadata synchronization (Data/Query Nodes → Coordinator)
  rpc SyncMetadata(SyncMetadataRequest) returns (SyncMetadataResponse);
  rpc GetCollectionMetadata(GetCollectionMetadataRequest) returns (GetCollectionMetadataResponse);

  // Query routing and execution (Proxy → Query Nodes)
  rpc RouteQuery(RouteQueryRequest) returns (RouteQueryResponse);
  rpc ExecuteShardQuery(ExecuteShardQueryRequest) returns (ExecuteShardQueryResponse);

  // Data transfer (for rebalancing)
  rpc TransferData(TransferDataRequest) returns (TransferDataResponse);

  // Health monitoring (All Nodes → Coordinator)
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetClusterHealth(GetClusterHealthRequest) returns (GetClusterHealthResponse);

  // Leader info (Operator → Coordinator; roadmap 0b.6.D)
  rpc GetLeaderInfo(GetLeaderInfoRequest) returns (GetLeaderInfoResponse);

  // Raft membership changes (Coordinator → Coordinator; roadmap 1.7b)
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
  rpc RemovePeer(RemovePeerRequest) returns (RemovePeerResponse);

  // Raft scale reconciliation (Operator → Coordinator; roadmap 1.8)
  rpc GetRaftMembership(GetRaftMembershipRequest) returns (GetRaftMembershipResponse);
  rpc TransferLeadership(TransferLeadershipRequest) returns (TransferLeadershipResponse);

  // Two-phase primary swap (Coordinator → Data Node).
  // PausePrimary stops the old primary accepting writes for the shard;
  // PreparePromote brings the new primary online at the bumped term.
  // Both calls are idempotent so the coordinator can replay on failure.
  rpc PausePrimary(PausePrimaryRequest) returns (PausePrimaryResponse);
  rpc PreparePromote(PreparePromoteRequest) returns (PreparePromoteResponse);

  // Backup and restore orchestration (Coordinator → Data Node).
  // BackupShard / RestoreShard execute the per-shard half of a backup
  // or restore against the data-node's local segment store and the
  // configured IObjectStore. FreezeWrites / UnfreezeWrites bracket the
  // BackupShard call so segment contents are stable for the upload.
  rpc BackupShard(BackupShardRequest) returns (BackupShardResponse);
  rpc RestoreShard(RestoreShardRequest) returns (RestoreShardResponse);
  rpc FreezeWrites(FreezeWritesRequest) returns (FreezeWritesResponse);
  rpc UnfreezeWrites(UnfreezeWritesRequest) returns (UnfreezeWritesResponse);

  // Timestamp oracle (All Nodes → Coordinator)
  rpc GetTimestamp(GetTimestampRequest) returns (GetTimestampResponse);
}